<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambar's Worksheets</title>
<style>
  :root {
    --green-dark: #1F5B2E; --green: #2E7D32; --green-pale: #E8F1E8;
    --green-mid: #C8E6C9; --muted: #555; --line: #AAA; --red: #C62828;
  }
  * { box-sizing: border-box; }
  body { font-family: Calibri, 'Segoe UI', Arial, sans-serif; margin: 0; background: #F0F4F0; color: #000; }
  .page { max-width: 860px; margin: 0 auto; padding: 22px 28px 80px; background: #fff; min-height: 100vh; box-shadow: 0 0 12px rgba(0,0,0,.08); }
  h1 { text-align: center; color: var(--green-dark); font-size: 26px; margin: 8px 0 2px; }
  .subtitle { text-align: center; color: var(--muted); font-style: italic; font-size: 14px; margin-bottom: 20px; }
  h2.track { color: var(--green-dark); font-size: 18px; border-bottom: 2px solid var(--green); padding-bottom: 4px; margin: 26px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--green-mid); border-radius: 10px; padding: 12px 14px; cursor: pointer; background: #fff; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 2px 10px rgba(46,125,50,.25); }
  .card .name { font-weight: bold; color: var(--green-dark); font-size: 15px; }
  .card .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .card .best { font-size: 12.5px; margin-top: 6px; color: var(--green); font-weight: bold; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  button { font-family: inherit; font-size: 14px; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--green); background: var(--green); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--green-dark); }
  .infobar { display: flex; gap: 16px; border-bottom: 2px solid #444; padding-bottom: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .infobar label { font-weight: bold; font-size: 14px; }
  .infobar input { border: none; border-bottom: 1px solid #444; font-size: 15px; padding: 2px 4px; width: 150px; outline: none; }
  .ws-title { text-align: center; color: var(--green-dark); font-size: 22px; font-weight: bold; margin: 2px 0; }
  .ws-sub { text-align: center; color: var(--muted); font-style: italic; font-size: 13px; margin-bottom: 14px; }
  .section { margin-top: 22px; }
  .sec-head { border-bottom: 2px solid var(--green); padding-bottom: 4px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .sec-head h3 { color: var(--green-dark); font-size: 16px; margin: 0; }
  .sec-head .marks { color: var(--muted); font-style: italic; font-size: 12.5px; }
  .instr { font-style: italic; color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
  .q { margin: 7px 0; font-size: 16px; line-height: 2; }
  .qnum { font-weight: bold; }
  input.ans { width: 62px; border: none; border-bottom: 2px solid var(--line); text-align: center; font-size: 16px; font-family: inherit; padding: 2px; outline: none; background: #fff; }
  input.ans:focus { border-bottom-color: var(--green); background: var(--green-pale); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 2px 16px; }
  .q.mcq { line-height: 1.6; margin: 12px 0; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 2px 18px; margin: 3px 0 2px 26px; font-size: 15px; }
  .opt { cursor: pointer; display: block; }
  .opt input { accent-color: var(--green); margin-right: 5px; }
  .sec-intro { border: 1px solid var(--green-mid); background: var(--green-pale); border-radius: 8px; padding: 8px 12px; font-size: 14.5px; line-height: 1.55; margin: 6px 0 10px; }
  .submitbar { margin-top: 30px; text-align: center; }
  .submitbar button { font-size: 16px; padding: 11px 30px; }
  .result { margin-top: 22px; border: 2px solid var(--green); border-radius: 10px; padding: 14px 18px; background: var(--green-pale); display: none; }
  .result h3 { margin: 0 0 6px; color: var(--green-dark); }
  .result table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
  .result th, .result td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  .result th { background: var(--green-mid); color: var(--green-dark); }
  .big-score { font-size: 28px; font-weight: bold; color: var(--green-dark); }
  .admin { margin-top: 30px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .admin summary { color: var(--muted); font-size: 13px; cursor: pointer; }
  .admin input[type=password] { border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; font-size: 15px; width: 100px; }
  .pin-msg { color: var(--red); font-size: 13px; font-style: italic; }
  .keypanel { display: none; margin-top: 10px; }
  .keypanel table { border-collapse: collapse; font-size: 13.5px; width: 100%; margin-bottom: 12px; }
  .keypanel th, .keypanel td { border: 1px solid var(--line); padding: 4px 9px; }
  .keypanel th { background: var(--green-mid); color: var(--green-dark); }
  .keypanel h4 { color: var(--green-dark); margin: 6px 0 4px; }
  .wrongmark { outline: 2px solid var(--red); border-radius: 3px; }
  .rightmark { outline: 2px solid var(--green); border-radius: 3px; }
  .hidden { display: none; }
  /* ---- print: clean paper worksheet, values optionally blanked ---- */
  @media print {
    body { background: #fff; }
    .page { box-shadow: none; max-width: none; padding: 0 10mm; }
    .topbar, .submitbar, .admin, .result { display: none !important; }
    input.ans { border-bottom: 1.5px solid #444; }
    .q { line-height: 2.3; }
  }
  body.print-blank input.ans { color: transparent !important; }
</style>
</head>
<body>
<div class="page">
  <div id="home">
    <h1>Ambar's Worksheets</h1>
    <div class="subtitle" id="homeSubtitle">Class III &bull; today's practice</div>
    <div id="trackList"></div>
    <details class="admin" id="homeAdminBox">
      <summary>Parent corner</summary>
      <p style="font-size:14px">PIN: <input type="password" id="homePin" maxlength="4" inputmode="numeric">
      <button class="secondary" onclick="unlockCatalogue()">Unlock</button>
      <span id="homePinMsg" class="pin-msg"></span></p>
      <div id="catalogue" class="hidden"></div>
    </details>
  </div>

  <div id="ws" class="hidden">
    <div class="topbar">
      <button class="secondary" onclick="goHome()">&#8592; Back</button>
      <div>
        <button class="secondary" onclick="printBlank()">Print blank (PDF)</button>
        <button class="secondary" onclick="window.print()">Print as-is</button>
      </div>
    </div>
    <div class="ws-title" id="wsTitle"></div>
    <div class="ws-sub" id="wsSub"></div>
    <div class="infobar">
      <div><label>Name: </label><input id="student" value="Ambar"></div>
      <div><label>Date: </label><input id="date" type="date"></div>
    </div>
    <div id="sections"></div>
    <div class="submitbar">
      <button id="submitBtn" onclick="submitSheet()">Finish &amp; Check</button>
      <div class="instr" style="margin-top:6px">Checking downloads a results file (CSV) automatically.</div>
    </div>
    <div class="result" id="resultBox">
      <h3>Result</h3>
      <div class="big-score" id="scoreLine"></div>
      <table id="sectionTable"></table>
      <p id="syncMsg" style="font-size:14px;color:var(--muted)"></p>
      <p style="margin-bottom:0"><button class="secondary" onclick="downloadCsv()">Download results (CSV)</button></p>
    </div>
    <details class="admin" id="adminBox">
      <summary>Admin</summary>
      <p style="font-size:14px">PIN: <input type="password" id="pin" maxlength="4" inputmode="numeric">
      <button class="secondary" onclick="unlockAdmin()">Unlock</button>
      <span id="pinMsg" class="pin-msg"></span></p>
      <div class="keypanel" id="keypanel"></div>
    </details>
  </div>
</div>

"text": "SOF IEO — Topic Deep-Dive: Verbs & Tenses\nFor Ambar, Class III CBSE\n\n1. What is a verb?\nA verb is a doing word or a being word. Every sentence has one. - Doing words: run, eat, play, write, sing - Being\nwords: is, am, are, was, were - Having words: has, have\n\nExample: “Ravi plays cricket.” / “Riya is happy.”\n\n2. The three tenses Ambar must know\nTense                              When it happens            Signal words                 Example\nSimple present                     Habits, facts              every day, always, usually   Ravi goes to school every\n                                                                                           day.\nPresent continuous                 Happening NOW              now, right now, Look!,       They are playing cricket\n                                                              Listen!                      now.\nSimple past                        Finished action            yesterday, last week, ago    Meena ate a mango\n                                                                                           yesterday.\nPast continuous                    Was going on in the past   when, while                  We were watching TV\n                                                                                           when Papa came.\n\nThe signal word decides the tense. IEO almost always plants one: “yesterday” forces past, “every day” forces\npresent, “now / Look!” forces continuous.\n\n3. The helping-verb table\nHelper            Use with                                           Time\nis                he, she, it, one thing                             present\nam                I                                                  present\nare               you, we, they, many things                         present\nwas               he, she, it, I                                     past\nwere              you, we, they, many things                         past\nhas               he, she, it                                        present\nhave              I, you, we, they                                   present\ndoes / do         he-she-it / all others                             present questions and “not”\ndid               everyone                                           past questions and “not”\n\nKey rule after does/did/do: the main verb goes back to base form. “Does your brother like cricket?” — never “likes”\nafter “does”.\n\n4. Subject-verb agreement (the -s rule)\n•      One person or thing → verb takes -s: The sun rises. She brushes.\n•      Many, or I/you → no -s: The stars shine. My grandparents live in Amritsar.\n•      Two subjects joined by “and” → plural verb: Riya and I are friends. My brother and my cousin play carrom.\n\n•      Each of / Every one of / Neither of → singular verb: Each of the boys has a bat. Neither of the girls knows the\n       answer.\n•      Neither A nor B → verb agrees with the nearer one: Neither Ravi nor his brothers want to play.\n•      Collective words (team, class, family) → usually singular: The team has won.\n\n5. Common traps\nTrap                                      Wrong                                    Right\n-s on the wrong verb                      Ravi go to school daily.                 Ravi goes to school daily.\nDouble -s after does                      Does he likes it?                        Does he like it?\nwas/were mix-up                           The children was playing.                The children were playing.\nhave/has mix-up                           She have been my friend.                 She has been my friend.\n“and” subject + singular verb             Rohan and Aman is here.                  Rohan and Aman are here.\nIgnoring the signal word                  Yesterday she goes home.                 Yesterday she went home.\nMade-up past forms                        bringed, flys, goed                      brought, flies, went\n\n6. High-frequency IEO question types\n1.     Fill the blank with a signal word present — “Last Sunday, we ___ to the zoo.” (went)\n2.     is/am/are/was/were choice — “Look! The baby ___ crying.” (is)\n3.     Find the error — one underlined part has the wrong verb (“The children was playing”).\n4.     Choose the correct sentence — four versions, only one has the verb right.\n5.     Double blank (Achiever’s) — \"Ravi ___ his lunch when the phone ___.\" (was eating, rang) — solve each blank\n       separately, then match the pair.\n6.     Which sentence is in the past continuous? — look for was/were + -ing.\n\n7. Key facts checklist\n•      Verb = doing/being word; every sentence has one.\n•      One doer → verb with -s; many doers → verb without -s.\n•      is (one) / am (I) / are (many); was (one) / were (many).\n•      has (he, she, it) / have (I, you, we, they).\n•      After does, do, did → base verb, no -s, no -ed.\n•      yesterday, ago, last → past; every day, always → present; now, Look! → continuous.\n•      Irregular pasts to memorise: go-went, eat-ate, bring-brought, sing-sang, take-took, leave-left, light-lit, drink-\n       drank.\n\n8. Quick drill (10 questions)\n1.     Ravi ___ his homework every evening. (do / does / doing / done)\n2.     Yesterday, the girls ___ rangoli. (make / makes / made / making)\n3.     Listen! Someone ___ at the door. (knocks / is knocking / knocked / knock)\n4.     I ___ seven years old. (is / am / are / be)\n5.     The cows ___ grazing when it started to rain. (was / is / were / are)\n6.     Each of the players ___ a cap. (have / has / are having / were)\n7.     Does Meena ___ paneer? (likes / liked / like / liking)\n8.     My parents ___ in Delhi. (works / work / is working / working)\n9.     Find the error: “She have a red cycle.” (She / have / a / red cycle)\n10.    Choose the pair: “The sun ___ when we ___ home.” (was shining, reached / is shining, reached / was shining,\n       reach / shines, reached)\n\nAnswers: 1. does 2. made 3. is knocking 4. am 5. were 6. "text": "SOF IEO — Topic Deep-Dive: Articles & Prepositions\nFor Ambar, Class III CBSE\n\nPART 1: ARTICLES (a, an, the)\n1.1 The three articles\nArticle                                 Use when                                 Examples\na                                       one thing, starts with a consonant       a book, a mango, a university, a\n                                        SOUND                                    one-eyed pirate\nan                                      one thing, starts with a vowel           an apple, an egg, an hour, an honest\n                                        SOUND                                    boy\nthe                                     one PARTICULAR thing, or one-of-a-       the sun, the Taj Mahal, the book I\n                                        kind things                              lost\n\n1.2 The golden rule: SOUND, not spelling\nThis is the single most tested article rule in IEO. - an hour, an honest man — the “h” is silent, so the word starts with\na vowel sound. - a university, a uniform, a European — “u” here sounds like “yu” (a consonant sound). - a one-\nrupee coin, a one-eyed pirate — “one” sounds like “wun”.\n\n1.3 When to use “the”\n•     Something already mentioned or known: “This is the book I told you about.”\n•     One-of-a-kind: the sun, the moon, the sky, the Earth.\n•     Rivers, monuments, oceans: the Ganga, the Taj Mahal, the Pacific.\n•     Superlatives: the best player, the tallest boy.\n\n1.4 When to use NO article\n•     Games and sports: We play cricket (not “the cricket”).\n•     Meals: We eat dinner at 8.\n•     Languages and subjects: She speaks Hindi. I like Maths.\n•     Things in general: I drink milk every morning. Cows give milk.\n•     Most proper names: Delhi, Ambar, India (but: the Ganga, the Himalayas).\n\nPART 2: PREPOSITIONS (position and time words)\n2.1 The top prepositions of place\nPreposition                             Meaning                                  Example\nin                                      inside                                   The keys are in the drawer.\non                                      touching the top / a surface             The clock hangs on the wall.\nunder                                   below                                    The shoes are under the bed.\nabove                                   higher, not touching                     The fan is above our heads.\nbehind                                  at the back of                           The dog hid behind the curtain.\nbetween                                 in the middle of TWO                     The post office is between the bank\n                                                                                 and the school.\nbeside                                  next to                                  Ammu sat beside me.\nat                                      an exact point/place                     We waited at the bus stop.\n\n2.2 Prepositions of time\n•      at + clock time: at 8 o’clock, at noon.\n•      on + day/date: on Sunday, on 14 June, on Diwali day.\n•      in + month/season/part of day: in June, in winter, in the morning (but at night).\n\n2.3 “Between” needs exactly TWO\n“He sat between his two friends” is right; “between his three friends” is wrong (that would be among). IEO loves this\ntrap.\n\n3. Common traps\nTrap                                      Wrong                                   Right\nSpelling, not sound                       an university, a hour                   a university, an hour\nArticle before uncountables               She poured a milk.                      She poured milk.\nMissing “the” for unique things           Sun rises in east.                      The sun rises in the east.\non vs in                                  The keys are on the drawer.             The keys are in the drawer.\non vs at (time)                           School starts on 8 o’clock.             School starts at 8 o’clock.\nabove vs on                               The clock is above the wall.            The clock is on the wall.\n“reached at”                              We reached at the station.              We reached the station.\n\n4. High-frequency IEO question types\n1.     Single blank — “___ umbrella was left on the bus.” (An)\n2.     No-article option — “We play ___ cricket.” (no article)\n3.     Double blank (Achiever’s) — “She is ___ honest girl. She always speaks ___ truth.” (an, the)\n4.     Error spotting — “She sat under an tree.” (an is wrong)\n5.     Preposition from a picture-like sentence — cat under/on/behind the table.\n6.     Correct-sentence choice — only one option has both article and preposition right.\n\n5. Key facts checklist\n•      a/an is decided by SOUND: an hour, a university, a one-rupee coin.\n•      “the” = particular things, one-of-a-kind things, monuments, rivers, superlatives.\n•      No article before games, meals, languages, milk/water in general.\n•      at + time, on + day/date, in + month/season; at night.\n•      between = two things only; beside = next to; above = higher without touching.\n\n6. Quick drill (10 questions)\n1.     I saw ___ owl in ___ old banyan tree. (a, an / an, an / an, the / the, a)\n2.     Mohan waited for ___ hour. (a / an / the / no article)\n3.     ___ Ganga flows through many cities. (A / An / The / No article)\n4.     We play ___ football on Saturdays. (a / an / the / no article)\n5.     The cat is hiding ___ the sofa. (behind / at / between / above)\n6.     My birthday is ___ 14 June. (in / at / on / by)\n7.     The aeroplane flew ___ the clouds. (under / above / at / beside)\n8.     Sita sat ___ her two cousins. (beside / between / at / behind)\n9.     Find the error: “He poured a water into the jug.” (poured / a / water / jug)\n10.    The bus arrives ___ 4 o’clock ___ Monday. (at, on / on, at / in, on / at, in)\n\nAnswers: 1. an, an 2. an 3. The 4. no article 5. behind 6. on 7. above 8. between 9. a (no article before water) 10. at,\non"

"title": "Notes: Reading Comprehension (Deep-Dive)",
"text": "SOF IEO — Topic Deep-Dive: Reading Comprehension & Written Expression\nFor Ambar, Class III CBSE\n\nPART 1: READING COMPREHENSION\n1.1 What the passage looks like\nIEO passages are 4–6 lines long, about familiar things: a pet, a market trip, a school event, a train journey. Five\nquestions follow. Most answers are written straight in the passage; one or two need a little thinking.\n\n1.2 The 4-step method\n1.     Read the passage slowly, once. Picture it like a cartoon in your head.\n2.     Read the question and find the question word: who? where? when? how many? why?\n3.     Go back and put your finger on the line that answers it. Never answer from memory alone.\n4.     Match the option to the passage words — the correct option usually repeats or slightly reword the passage.\n\n1.3 The three kinds of questions\nKind                                     Example                                  How to solve\nFact (written in passage)                “How many biscuits?”                     Point to the exact line.\nWord meaning                             “Which word means ‘covered with          Reread the sentence with each\n                                         soft hair’?”                             option in place.\nThinking / inference                     “Who most likely was the white-          Combine clues (going to Nani’s\n                                         haired lady?”                            village + lady waving = Nani).\n\nTrap: options that are TRUE in real life but NOT in the passage. If the passage says “two biscuits”, the answer is two\n— even if your squirrel at home eats three.\n\n1.4 Moral / “what does the story teach us”\nPick the lesson the WHOLE story shows, not one detail. A boy who loses a race but keeps smiling teaches “never give\nup” — not “badges are precious”.\n\nPART 2: WRITTEN EXPRESSION\n2.1 A correct sentence needs three things\n1.     Capital letter at the start — and for names (Ravi, Delhi, India, Monday, Diwali) and the word “I”.\n2.     Correct end mark — see the table below.\n3.     Words in sensible order.\nSentence type                 Example                                       End mark\nStatement                     Ravi plays football.                          full stop (.)\nQuestion                      Where is my pencil?                           question mark (?)\nExclamation                   What a lovely day!                            exclamation mark (!)\nCommand                       Shut the window.                              full stop (.)\n\nBig trap: “How old is your brother” needs ?, but “How beautifully she dances” is an exclamation and needs !. Ask: is\nit really asking something?\n\n2.2 Rearranging jumbled words\nMethod: find the doer (naming word) first, then the action, then the rest. - school / to / walks / Riya → Riya (doer) +\nwalks (action) + to school → “Riya walks to school.” - Check the winning option starts with a capital and ends with\nthe right mark. - Reject orders that sound silly even if the words fit: “The match won our team.” — a match cannot\nwin a team.\n\n2.3 Polite speech\nThe polite version almost always contains please, may I, excuse me, thank you, or you are welcome.\n\nRude                                     Polite\nGive me water.                           May I have some water, please?\nMove aside.                              Excuse me, may I pass, please?\nTell me the answer!                      Excuse me madam, may I ask a question?\n\nReply to “Thank you” with “You are welcome.” Greet by time of day: good morning / good evening; “good night” is\nonly for bedtime.\n\n2.4 Commas\nUse commas to separate items in a list: “I bought apples, bananas and grapes.” No comma before the first item or\nafter “and”.\n\n3. Common traps\nTrap                                                         Beat it by\nAnswering from memory, not passage                           Always point back to the line.\nReal-life-true but passage-false options                     Only the passage counts.\n? vs ! on “What/How” sentences                               Is it a real question?\nJumbled sentence with two “possible” orders                  Pick the one that makes SENSE, with capital + end mark.\n“Okay.” as a polite reply                                    Polite replies use the magic words.\n\n4. Key facts checklist\n•      Read passage once fully, then hunt each answer with your finger.\n•      Fact answers are written in the passage; inference answers combine clues.\n•      Capital letters: sentence start, names, places, days, festivals, “I”.\n•      . statement/command, ? question, ! exclamation.\n•      Jumbled words: doer, then action, then the rest.\n•      Polite words: please, may I, excuse me, thank you, you are welcome.\n\n5. Quick drill (10 questions)\nPassage: “Golu the puppy dug a hole near the gate and buried his rubber bone. In the evening, he forgot the spot. He\nsniffed all round the garden until his nose led him to the gate. Golu dug fast, found his bone and wagged his tail with\njoy.”\n\n1.     What did Golu bury? (a stick / a rubber bone / a biscuit / a ball)\n2.     Where did he bury it? (near the gate / under a tree / in a pot / behind the house)\n3.     What helped Golu find the spot? (his eyes / his ears / his nose / his paws)\n4.     “Wagged his tail with joy” shows Golu was ___. (angry / happy / sleepy / hungry)\n5.     What does the story show about Golu? (he gave up quickly / he kept trying till he found it / he lost his bone\n       forever / he disliked bones)\n\n6.  Rearrange: books / Riya / her / packed (Riya packed her books. / Books her Riya packed. / Her Riya books\n    packed. / Packed books Riya her.)\n7. Which needs a question mark: “How far is the station” or “How tall that tree is”?\n8. Which is polite? (Get my bag. / Please get my bag.)\n9. Which is correct? (“i live in Pune.” / “I live in Pune.”)\n10. Choose the correct commas: (I need a pen, a ruler and glue. / I need, a pen a ruler and glue.)\n\nAnswers: 1. a rubber bone 2. near the gate 3. his nose 4. happy 5. he kept trying till he found it 6. Riya packed her\nbooks. 7. “How far is the station?” 8. Please get my bag. 9. “I live in Pune.” 10. I need a pen, a ruler and glue."
},

"id": "note-nso-food",
"track": "SOF NSO — Science",
"title": "Notes: Food (Deep-Dive)",
"text": "SOF NSO Science — Topic Deep-Dive: Food\nFor Ambar, Class III CBSE\n\n1. Where our food comes from\nAll the food we eat comes from either plants or animals.\n\nFood from plants\nPlants give us the biggest part of our meals.\n\nType                        What it is                                        Examples\nFruits                      Sweet or juicy parts of plants                    Mango, apple, banana, orange, guava\nVegetables                  Leaves, roots, stems we eat                       Spinach (palak), potato, carrot, onion\nGrains (cereals)            Seeds of grass-like plants                        Rice, wheat, maize, bajra\nPulses (dals)               Seeds of pod plants                               Rajma, chana, moong, arhar\nSpices                      Added for taste and smell                         Turmeric (haldi), chilli, ginger, black\n                                                                              pepper\n\nWe also get oil (from mustard, groundnut), sugar (from sugarcane) and tea from plants.\n\nFood from animals\nFood                                      Animal that gives it\nMilk                                      Cow, buffalo, goat\nEgg                                       Hen (and other birds)\nHoney                                     Bees\nMeat / fish                               Goat, hen, fish\n\nTrap to remember: milk, egg and honey ALL come from animals. Honey is often mistaken as coming from flowers —\nbut it is made by bees, so it is an animal food. Ghee, butter and cheese all come from milk.\n\n2. Three kinds of food (why we eat)\nEvery food does a special job in our body.\n\nKind                               Job                           Examples\nEnergy-giving                      Give us power to run,         Rice, bread, chapati, potato, sugar, ghee, oil\n                                   play, work\nBody-building                      Help us grow and repair       Egg, milk, dal (pulses), fish, meat, cheese\n                                   the body\nProtective                         Keep us healthy and fight     Fruits and green vegetables (they have vitamins)\n                                   diseases\n\nA quick way to remember: carbohydrates and fats give energy; proteins build the body; vitamins and minerals\nprotect it.\n\n3. Balanced diet\nA balanced diet is a meal that has ALL three kinds of food in the right amount — energy-giving, body-building and\nprotective — plus water.\n\nA good Indian plate = roti/rice (energy) + dal or egg (body-building) + sabzi and a fruit (protective).\n\nIf a food group is missing, our body suffers: - Only rice and bread → too little protein and vitamins (this is a very\ncommon exam question). - No fruits or vegetables → we fall sick more easily.\n\n4. Cooked and raw food\nSome foods we eat raw (uncooked): cucumber, tomato, carrot, most fruits, salad.\n\nSome foods must be cooked before eating: raw rice, raw dal, wheat flour, potato. Cooking: - kills germs, - makes\nfood soft and easy to digest, - makes it tastier.\n\nEating some raw fruits and salad is healthy because heat can destroy some vitamins.\n\n5. Healthy eating habits\n•    Wash hands before eating.\n•    Eat fresh, clean food; wash fruits and vegetables.\n•    Chew food well; do not eat too fast.\n•    Drink plenty of clean water.\n•    Do not skip breakfast.\n•    Eat less junk food (chips, cold drinks, too many sweets) — it makes us unfit.\n\nCommon traps\nThe trap                                                  The truth\n“Honey comes from flowers/plants”                         Honey is made by bees → it is an animal food\n“Sugar is a body-building food”                           Sugar gives energy, it does not build the body\n“Fruits give the most energy”                             Fruits are protective (vitamins); rice and roti give energy\n“A plate of only rice is balanced”                        It is missing protein and protective foods\n“All food should be cooked”                               Many fruits and salad are eaten raw\n“Eggs come from cows”                                     Eggs come from hens; cows give milk\n\nHigh-frequency question types\n1.   Source: “Which food comes from an animal / a plant?”\n2.   Classify: \"Rajma and chana are examples of ___\" → pulses.\n3.   Function: “Egg is a ___ food” → body-building.\n4.   Balanced meal: “What should be added to make this meal balanced?”\n5.   Odd one out: rice, wheat, maize, egg (egg is the odd one — an animal food).\n6.   Cooked vs raw: “Which must be cooked?” → raw rice/dal.\n\nKey facts checklist\n•    ☐ Food comes from plants and animals.\n•    ☐ Fruits, vegetables, grains, pulses, spices come from plants.\n•    ☐ Milk, egg, honey, meat, fish come from animals.\n\n•     ☐ Energy foods = rice, roti, potato, sugar, ghee.\n•     ☐ Body-building foods = egg, milk, dal, fish.\n•     ☐ Protective foods = fruits and green vegetables.\n•     ☐ Balanced diet = all three kinds + water.\n•     ☐ Only rice+bread → lacks protein and vitamins.\n•     ☐ Wash hands before eating; eat fresh food.\n\nQuick drill (10 questions)\n1.    Honey is made by which animal?\n2.    Rajma and chana are examples of ___.\n3.    Which food gives us the most energy: rice or orange?\n4.    Egg is an energy / body-building / protective food?\n5.    Fruits and vegetables are called ___ foods.\n6.    Name one food we usually eat raw.\n7.    Which food must be cooked before eating: cucumber or rice?\n8.    A meal of only rice and bread lacks ___.\n9.    Butter and ghee are made from ___.\n10.   What should we do before eating food?\n\nAnswers: 1. Bees 2. Pulses 3. Rice 4. Body-building 5. Protective 6. Cucumber/tomato/salad (any raw one) 7. Rice 8.\nProteins and vitamins 9. Milk 10. Wash our hands"
},
{
"id": "note-nso-body",
"track": "SOF NSO — Science",
"title": "Notes: Human Body (Deep-Dive)",
"text": "SOF NSO Science — Topic Deep-Dive: Human Body\nFor Ambar, Class III CBSE\n\n1. Major organs and their jobs\nInside our body are special parts called organs. Each organ does one important job.\n\nOrgan                               Its job\nHeart                               Pumps blood to every part of the body\nLungs                               Help us breathe (take in air)\nBrain                               Helps us think, remember and control the body\nStomach                             Digests the food we eat\nBones (skeleton)                    Give the body shape and support\nMuscles                             Help the body to move\n\nThe heart never stops — it beats faster when we run. The lungs take in air when we breathe. The brain is the “boss”\nof the body and is protected by the hard skull bones. The skeleton is the full framework of bones; muscles pull on\nbones to make us move.\n\n2. The five sense organs\nWe learn about the world through five sense organs.\n\nSense organ                 Sense               What it does\nEyes                        Sight               See light, colour and things\nEars                        Hearing             Hear sounds\nNose                        Smell               Smell good and bad things\nTongue                      Taste               Taste sweet, salty, sour, bitter\nSkin                        Touch               Feel heat, cold, pain, pressure\n\nSkin is the largest sense organ — it covers the whole body. The tongue also helps us to speak. When you have a cold,\nyour nose is blocked, so you cannot smell your food.\n\n3. Teeth\nTeeth help us bite and chew food so the stomach can digest it easily. - Our first set is called milk teeth; they fall out\nand are replaced by permanent teeth. - We should brush twice a day (morning and night). - Eating too many sweets\nand not brushing causes tooth decay (cavities).\n\n4. Safety and first aid basics\nSmall accidents happen. Simple first aid helps:\n\nSmall injury                   First aid\nSmall cut                      Clean it and cover it with a bandage\nSmall burn                     Put it under clean, cool water\n\nNosebleed                      Sit down, pinch the nose gently\n\nA first-aid box keeps bandages, cotton and antiseptic (a germ-killing liquid). We should not play with fire, sharp\nknives or electric sockets.\n\n5. Hygiene habits (keeping clean)\nGood habits keep germs away and keep us healthy: - Bathe daily and wear clean clothes. - Wash hands with soap\nbefore eating and after using the toilet. - Brush teeth twice a day. - Cut nails regularly. - Cover mouth with a tissue\nor elbow while coughing or sneezing. - Drink clean water and eat fresh food.\n\nThese habits stop germs and protect us from many diseases.\n\nCommon traps\nThe trap                                                 The truth\n“The heart helps us breathe”                             The lungs help us breathe; the heart pumps blood\n“The stomach helps us think”                             The brain thinks; the stomach digests food\n“We have three sense organs”                             We have five sense organs\n“We taste with our nose”                                 We taste with the tongue; smell with the nose\n“Brush teeth once a day is enough”                       Brush twice a day\n“For a cut, rub mud on it”                               Clean it and cover it; never use mud\n\nHigh-frequency question types\n1.   Organ-job match: “Which organ pumps blood?” → Heart.\n2.   Sense organ: “Which sense organ helps us smell?” → Nose.\n3.   Analogy: \"Eyes : See :: Ears : ___\" → Hear.\n4.   Hygiene: “How many times should we brush?” → Twice.\n5.   First aid: \"First aid for a small cut is ___\" → clean and cover.\n6.   Which uses many organs: eating a fruit uses eyes, nose, tongue, teeth, stomach.\n\nKey facts checklist\n•    ☐ Heart pumps blood; lungs help breathe.\n•    ☐ Brain helps us think; stomach digests food.\n•    ☐ Bones give shape; muscles help move.\n•    ☐ Five sense organs: eyes, ears, nose, tongue, skin.\n•    ☐ Skin is the largest sense organ.\n•    ☐ Brush teeth twice a day.\n•    ☐ Milk teeth are replaced by permanent teeth.\n•    ☐ Wash hands before eating; bathe daily.\n•    ☐ For a small cut: clean and cover it.\n\nQuick drill (10 questions)\n1.   Which organ pumps blood?\n2.   Which organ helps us to breathe?\n3.   Which organ helps us to think?\n4.   Where is food digested?\n5.   How many sense organs do we have?\n\n6.    Which sense organ helps us to hear?\n7.    Which is the largest sense organ?\n8.    How many times a day should we brush our teeth?\n9.    What should we do before eating food?\n10.   What is the first aid for a small cut?\n\nAnswers: 1. Heart 2. Lungs 3. Brain 4. Stomach 5. Five 6. Ears 7. Skin 8. Twice 9. Wash our hands 10. Clean it and\ncover it"
},

"id": "note-nso-matter",
"track": "SOF NSO — Science",
"title": "Notes: Matter & Materials (Deep-Dive)",
"text": "SOF NSO Science — Topic Deep-Dive: Matter & Materials\nFor Ambar, Class III CBSE\n\n1. Three states of matter\nEverything around us is made of matter. Matter is found in three forms called states: solid, liquid and gas.\n\nState               Shape                 Can it be poured?                                    Examples\nSolid               Fixed shape of        No                                                   Stone, chair, book, ice,\n                    its own                                                                    iron nail\nLiquid              Takes the shape       Yes                                                  Water, milk, oil, honey,\n                    of its container                                                           juice\nGas                 No fixed shape;       Yes (flows)                                          Air, steam, the gas in a\n                    fills all the space                                                        balloon\n\nKey ideas: - A solid keeps its own shape. You must press or cut it to change it (like clay). - A liquid flows and takes the\nshape of the glass, bottle or jar it is in. - A gas spreads out to fill the whole container. That is why a balloon becomes\nbig when we fill it with air.\n\nTrap: Honey is thick and sticky, but it flows and takes the shape of its jar — so honey is a liquid, not a solid.\n\n2. Natural and man-made materials\nType                          Meaning                                     Examples\nNatural                       Found ready in nature                       Wood (trees), cotton (plant), wool (sheep),\n                                                                          stone, water\nMan-made                      Made by people in factories                 Plastic, glass, nylon, paper\n\nCotton and wool grow in nature; plastic and nylon are made by people.\n\n3. Uses of materials\nWe choose a material for a job because of its special property.\n\nMaterial         Property                                                  We use it to make\nWood             Strong, does not let heat pass                            Tables, chairs, doors\nMetal            Strong, lasts long, does not burn                         Spoons, vessels, tools\nPlastic          Light, does not let water through                         Buckets, bottles, raincoats\nGlass            See-through (transparent)                                 Windows, tumblers, mirrors\nRubber           Can stretch and bend                                      Tyres, balls, erasers\nCloth            Soft                                                      Clothes, curtains, bedsheets\n\nWe make cooking pots of metal (not paper) because metal is strong and does not burn. We make windows of glass\nso that light can pass and we can see through.\n\n4. Floating and sinking\nPut things in water and some float while some sink. - Float: wooden stick, dry leaf, plastic ball, empty bottle. - Sink:\niron nail, stone, coin, key.\n\nDifferent materials behave differently. Interestingly, a heavy iron ship floats because of its shape — so shape can\nhelp heavy things float.\n\n5. Soluble and insoluble\nWhen we mix a substance in water: - Soluble = it dissolves and disappears into the water. Examples: salt, sugar. -\nInsoluble = it does not dissolve; it settles at the bottom. Examples: sand, chalk powder, stones.\n\nIf we leave salt water in the sun, the water evaporates and the salt is left behind — showing the salt was still there,\njust dissolved.\n\nCommon traps\nThe trap                                                  The truth\n“Honey is a solid because it is thick”                    Honey flows → it is a liquid\n“Plastic and glass are natural”                           They are man-made\n“Cotton is man-made”                                      Cotton is natural (from a plant)\n“Sand dissolves in water”                                 Sand is insoluble; it settles down\n“All heavy things sink”                                   A heavy iron ship floats because of its shape\n“A gas has a fixed shape”                                 A gas has no fixed shape; it fills all the space\n\nHigh-frequency question types\n1.   State of matter: \"Air is a ___\" → gas.\n2.   Property: \"A liquid takes the shape of its ___\" → container.\n3.   Natural vs man-made: “Which is man-made?” → plastic.\n4.   Material use: \"Tyres are made of ___\" → rubber.\n5.   Float/sink: “Which floats?” → wooden stick.\n6.   Soluble: “Which dissolves in water?” → sugar/salt.\n\nKey facts checklist\n•    ☐ Three states: solid, liquid, gas.\n•    ☐ Solid = fixed shape; liquid = takes container shape; gas = fills all space.\n•    ☐ Honey is a liquid; ice is solid water; steam is gas.\n•    ☐ Natural: wood, cotton, wool, stone. Man-made: plastic, glass, nylon.\n•    ☐ Wood → furniture; metal → vessels; glass → windows; rubber → tyres; cloth → clothes.\n•    ☐ Wood floats; iron nail and stone sink.\n•    ☐ Salt and sugar dissolve (soluble); sand does not (insoluble).\n\nQuick drill (10 questions)\n1.   Name the three states of matter.\n2.   Which state takes the shape of its container?\n3.   Is honey a solid or a liquid?\n4.   Is plastic natural or man-made?\n\n5.    Tyres are made of which material?\n6.    Windows are made of which see-through material?\n7.    Does a wooden stick float or sink in water?\n8.    Does an iron nail float or sink?\n9.    Which dissolves in water: sugar or sand?\n10.   Ice is the ___ form of water.\n\nAnswers: 1. Solid, liquid, gas 2. Liquid 3. Liquid 4. Man-made 5. Rubber 6. Glass 7. Float 8. Sink 9. Sugar 10. Solid"
},

"id": "note-nso-water",
"track": "SOF NSO — Science",
"title": "Notes: Water & Air (Deep-Dive)",
"text": "SOF NSO Science — Topic Deep-Dive: Water & Air\nFor Ambar, Class III CBSE\n\n1. Sources of water\nWater comes from many places: - Rain — the main source of fresh water. - Rivers, lakes, ponds, seas — surface\nwater. - Wells, hand pumps, borewells — underground water. - Taps at home bring us clean, stored water.\n\nWe should always drink clean, covered water so that germs and dirt do not get in.\n\n2. States of water\nWater is found in all three states:\n\nState              Form of water                               Example\nSolid              Ice                                         Ice cubes, snow\nLiquid             Water                                       Water we drink, rain\nGas                Water vapour (steam)                        Steam from boiling water\n\nWater can change from one state to another when we heat or cool it.\n\n3. The water cycle\nThe Sun’s heat moves water round and round the Earth. This is the water cycle.\n\n1.      Evaporation — The Sun heats water in seas, rivers and ponds. The water turns into water vapour (a gas) and\n        rises up.\n2.      Condensation — High up, the vapour cools and forms tiny drops that make clouds.\n3.      Rain (precipitation) — The drops join, become heavy, and fall down as rain.\n4.      Collection — Rain water collects in rivers, lakes and seas, and the cycle begins again.\n\nEveryday proof: - Wet clothes dry in the sun because water evaporates. - Water drops appear on a cold glass\nbecause vapour in the air condenses on it.\n\n4. Saving water\nClean water is precious and limited. We should save it: - Close the tap while brushing teeth or soaping hands. - Fix\nleaking taps and pipes. - Reuse water (like vegetable-washing water for plants). - Do not let tanks overflow.\n\n5. Air is everywhere\nAir is all around us, even though we cannot see it. We know air is there when: - the wind moves leaves and flies a\nkite, - a balloon becomes big when filled with air.\n\nAir takes up space and can be felt as wind (moving air). Wind can turn windmills and push sailing boats.\n\nWhat is in the air\nGas                           Its use\n\nOxygen                       We (and animals) breathe it in to stay alive\nCarbon dioxide               Plants take it in to make their food\n\nWe breathe in oxygen and breathe out carbon dioxide. Plants take in the carbon dioxide and give out oxygen — so\nplants and animals help each other.\n\n6. Air pollution basics\nAir pollution is when the air becomes dirty and smoky. It is caused by: - smoke from vehicles and factories, - burning\nrubbish and coal.\n\nWe can keep the air clean by planting more trees, using cycles and buses, and not burning waste. Trees clean the air\nby taking in carbon dioxide and giving out oxygen.\n\nCommon traps\nThe trap                                                 The truth\n“We breathe in carbon dioxide”                           We breathe in oxygen, out carbon dioxide\n“Plants take in oxygen to make food”                     Plants take in carbon dioxide to make food\n“Rain comes up from the ground”                          Rain falls from clouds in the sky\n“Ice is the gas form of water”                           Ice is the solid form; steam is the gas form\n“Trees pollute the air”                                  Trees clean the air; smoke pollutes it\n“Clouds are made of smoke”                               Clouds are made of tiny water drops\n\nHigh-frequency question types\n1.   Water cycle order: evaporation → condensation → rain.\n2.   State of water: “Ice is the ___ form of water” → solid.\n3.   Gas we breathe: \"We breathe in ___\" → oxygen.\n4.   Gas plants use: \"Plants take in ___\" → carbon dioxide.\n5.   Air present: \"A kite flies because of ___\" → wind.\n6.   Saving water: “Which saves water?” → closing the tap while brushing.\n\nKey facts checklist\n•    ☐ Sources of water: rain, rivers, lakes, wells, taps.\n•    ☐ Water has three states: ice (solid), water (liquid), vapour (gas).\n•    ☐ Water cycle: evaporation → condensation → rain → collection.\n•    ☐ The Sun’s heat drives the water cycle.\n•    ☐ We breathe in oxygen, breathe out carbon dioxide.\n•    ☐ Plants take in carbon dioxide to make food, give out oxygen.\n•    ☐ Moving air is wind; air is everywhere and takes up space.\n•    ☐ Save water; plant trees to keep air clean.\n\nQuick drill (10 questions)\n1.   Name one natural source of water.\n2.   Ice is the ___ form of water.\n3.   What is water vapour — solid, liquid or gas?\n4.   What is it called when water turns into vapour on heating?\n\n5.    What is it called when vapour cools into drops?\n6.    Water falling from clouds is called ___.\n7.    Which gas do we breathe in?\n8.    Which gas do plants take in to make food?\n9.    Moving air is called ___.\n10.   Name one way to keep the air clean.\n\nAnswers: 1. River/lake/rain (any) 2. Solid 3. Gas 4. Evaporation 5. Condensation 6. Rain 7. Oxygen 8. Carbon dioxide\n9. Wind 10. Plant more trees"
},
{
"id": "note-nso-transport",
"track": "SOF NSO — Science",
"title": "Notes: Transport & Communication (Deep-Dive)",
"text": "SOF NSO Science — Topic Deep-Dive: Transport & Communication\nFor Ambar, Class III CBSE\n\n1. What is transport?\nTransport means carrying people and goods from one place to another. There are three kinds, based on where they\ntravel.\n\nType                   Travels on/in                                              Examples\nLand transport         Roads and rails                                            Car, bus, train, cycle, auto-\n                                                                                  rickshaw, bullock cart\nWater transport        Water                                                      Boat, ship, steamer\nAir transport          Air (sky)                                                  Aeroplane, helicopter\n\nRemember: a ship travels on water, an aeroplane travels in the air, and a bus travels on land.\n\n2. Fast and slow\nDifferent vehicles travel at different speeds.\n\nFastest → Slowest                                     Example\nFastest                                               Aeroplane\nFast                                                  Train, car\nSlow                                                  Bicycle\nSlowest                                               Bullock cart, walking\n\nTo travel a long distance quickly (like Delhi to Chennai in one day), the aeroplane is best. To cross a river with no\nbridge, a boat is best.\n\n3. Fuels\nMost vehicles need fuel to move: - Cars, buses, motorbikes → petrol or diesel. - Aeroplanes → a special fuel\n(aviation fuel). - A bicycle needs no fuel — we move it with our own leg power.\n\n4. What is communication?\nCommunication means sharing news, messages or ideas with others. Long ago people sent messages by letters\ncarried by post, which took many days. Today we have fast ways too.\n\nMeans                                    What it is\nLetter                                   A written message sent by post\nTelephone / mobile                       Talk to someone far away at once\nTelevision (TV)                          Watch news and shows\nNewspaper                                Read the daily news\nInternet / e-mail                        Send messages and see people quickly\nRadio                                    Listen to news and music\n\n5. Personal and mass communication\nType                          Meaning                                     Examples\nPersonal                      Message to one person (one-to-one)          A letter to one friend, a phone call\nMass                          Reaches many people at once                 Newspaper, TV, radio\n\nSo a private letter or phone call is personal; a TV news channel or newspaper is mass communication.\n\nTo send a written message quickly to one cousin today, an e-mail or phone message on the internet is best — a\nposted letter would take days.\n\nCommon traps\nThe trap                                                  The truth\n“An aeroplane travels on water”                           It travels in the air\n“A ship travels on land”                                  A ship travels on water\n“A bicycle needs petrol”                                  A bicycle needs no fuel — we pedal it\n“A newspaper is personal communication”                   A newspaper is mass communication\n“A phone call to one person is mass communication”        It is personal (one-to-one)\n“A bullock cart is the fastest”                           The aeroplane is the fastest; the cart is slowest\n\nHigh-frequency question types\n1.     Classify transport: “A ship is ___ transport” → water.\n2.     Fastest/slowest: “Which is the fastest?” → aeroplane.\n3.     Fuel: \"Cars run on ___\" → petrol/diesel.\n4.     Means of communication: \"We read the news in a ___\" → newspaper.\n5.     Personal vs mass: “TV news to many people is ___ communication” → mass.\n6.     Best choice: \"To cross a river with no bridge, use a ___\" → boat.\n\nKey facts checklist\n•      ☐ Land transport: car, bus, train, cycle.\n•      ☐ Water transport: boat, ship.\n•      ☐ Air transport: aeroplane, helicopter.\n•      ☐ Aeroplane = fastest; bullock cart = slowest.\n•      ☐ Cars/buses use petrol or diesel; a cycle needs no fuel.\n•      ☐ Communication: letter, telephone, TV, newspaper, internet, radio.\n•      ☐ Personal = one person (letter, phone call).\n•      ☐ Mass = many people (newspaper, TV, radio).\n\nQuick drill (10 questions)\n1.     A ship travels on ___.\n2.     An aeroplane travels in the ___.\n3.     A bus travels on ___.\n4.     Which is the fastest way to travel far?\n5.     Which is the slowest: aeroplane or bullock cart?\n6.     Cars and buses run on which fuel?\n7.     Which vehicle needs no fuel?\n\n8. We read the daily news in a ___.\n9. A phone call to one person is ___ communication.\n10. A TV news channel reaching many people is ___ communication.\n\nAnswers: 1. Water 2. Air 3. Land 4. Aeroplane 5. Bullock cart 6. Petrol or diesel 7. Bicycle 8. Newspaper 9. Personal\n10. Mass"
},
{
"id": "note-nso-earth",
"track": "SOF NSO — Science",
"title": "Notes: Earth & Universe (Deep-Dive)",
"text": "SOF NSO Science — Topic Deep-Dive: Earth & Universe\nFor Ambar, Class III CBSE\n\n1. Sun, Moon, stars and planets\nWhen we look at the sky we see many things.\n\nObject                                             What it is\nSun                                                A star — it gives us heat and light in the day\nMoon                                               The Earth’s natural satellite — seen at night\nStars                                              Huge balls of burning gas that make their own light; look tiny\n                                                   because they are very far away\nPlanets                                            Big round bodies that go around the Sun; they do not make their\n                                                   own light\n\nThe Sun is a star — it looks the biggest and brightest only because it is the nearest star to the Earth. Stars look like\ntiny points because they are very, very far away.\n\n2. The planets\nEight planets move around the Sun. - Mercury is the planet closest to the Sun. - Jupiter is the largest planet. - Earth\nis the planet we live on.\n\nThe order of the first few planets from the Sun is: Mercury, Venus, Earth, Mars… (Mercury is first, then Venus, then\nour Earth).\n\n3. Day and night — the Earth’s rotation\nThe Earth spins around like a top. This spinning is called rotation. - The Earth takes one day to spin once. - The side\nfacing the Sun has day; the side turned away has night. - So when it is day in India, it is night on the other side of the\nworld.\n\nThe rotation (spinning) of the Earth gives us day and night.\n\n4. The year — the Earth’s revolution\nThe Earth also moves in a big path around the Sun. This is called revolution. - The Earth takes about one year to go\nonce around the Sun.\n\nRotation → day and night. Revolution → one year. (Do not mix these two up!)\n\n5. Phases of the Moon\nThe Moon does not make its own light. It shines because it reflects the Sun’s light.\n\nAs the month passes, we see different lit parts of the Moon, so it looks like it changes shape — full moon, half moon,\nthin crescent. These changing shapes are the phases of the Moon.\n\n6. Natural and artificial satellites\nA satellite is a body that goes around a planet.\n\nType                            Meaning                                        Example\nNatural satellite               Made by nature                                 The Moon (goes around Earth)\nArtificial satellite            Made by people and sent into space             Weather satellites, TV satellites\n\nArtificial satellites help us with weather news, telephone and TV signals.\n\nCommon traps\nThe trap                                                   The truth\n“The Sun is a planet”                                      The Sun is a star\n“The Moon makes its own light”                             The Moon only reflects the Sun’s light\n“Rotation gives us a year”                                 Rotation gives day and night; revolution gives a year\n“Earth is the largest planet”                              Jupiter is the largest; Earth is where we live\n“The Moon is an artificial satellite”                      The Moon is a natural satellite\n“Stars are small”                                          Stars are huge; they only look tiny because they are far\n\nHigh-frequency question types\n1.     What is it: \"The Sun is a ___\" → star.\n2.     Planet facts: “Which planet is closest to the Sun?” → Mercury; “largest?” → Jupiter.\n3.     Rotation: \"The spinning of the Earth gives us ___\" → day and night.\n4.     Revolution: \"One round of Earth around the Sun = ___\" → one year.\n5.     Satellite: \"The Moon is Earth’s natural ___\" → satellite.\n6.     Moon light: \"The Moon shines because it ___\" → reflects the Sun’s light.\n\nKey facts checklist\n•      ☐ The Sun is a star; it gives heat and light.\n•      ☐ The Moon is Earth’s natural satellite; seen at night.\n•      ☐ Stars make their own light; look tiny because they are far.\n•      ☐ Eight planets go around the Sun.\n•      ☐ Mercury = closest to the Sun; Jupiter = largest planet.\n•      ☐ Order from Sun: Mercury, Venus, Earth, Mars…\n•      ☐ Rotation (spinning) → day and night.\n•      ☐ Revolution (round the Sun) → one year.\n•      ☐ Moon reflects the Sun’s light; phases = changing shapes.\n•      ☐ Natural satellite = Moon; artificial satellite = made by people.\n\nQuick drill (10 questions)\n1.     The Sun is a star or a planet?\n2.     Which planet is closest to the Sun?\n3.     Which is the largest planet?\n4.     How many planets go around the Sun?\n5.     On which planet do we live?\n\n6.    The spinning of the Earth gives us ___.\n7.    One round of the Earth around the Sun gives one ___.\n8.    The Moon is Earth’s natural ___.\n9.    Does the Moon make its own light?\n10.   A satellite made by people is called a(n) ___ satellite.\n\nAnswers: 1. Star 2. Mercury 3. Jupiter 4. Eight 5. Earth 6. Day and night 7. Year 8. Satellite 9. No — it reflects the\nSun’s light 10. Artificial"
},

"id": "note-imo-division",
"track": "SOF IMO — Math",
"title": "Notes: Division (Deep-Dive)",
"text": "SOF IMO — Topic Deep-Dive: Division\nFor Ambar, Class III CBSE\n\n1. What division means\nDivision is sharing equally or making equal groups.\n\n•      Sharing: 12 laddoos shared equally among 3 children → each child gets 12 ÷ 3 = 4 laddoos.\n•      Grouping: 12 laddoos packed 3 per box → 12 ÷ 3 = 4 boxes.\n\nBoth stories use the same fact, but the question changes: “how many EACH?” (sharing) vs “how many GROUPS?”\n(grouping). IMO papers use both wordings.\n\nDivision is also repeated subtraction: 12 − 3 − 3 − 3 − 3 = 0, so 3 goes into 12 four times.\n\nThe names of the parts\nIn 14 ÷ 2 = 7:\n\nNumber             Name                        Meaning\n14                 Dividend                    the number being divided\n2                  Divisor                     the number we divide by\n7                  Quotient                    the answer\n(0)                Remainder                   what is left over\n\n2. Division and multiplication are a family\nEvery multiplication fact gives TWO division facts:\n\nMultiplication                         Division fact 1                          Division fact 2\n6 × 7 = 42                             42 ÷ 6 = 7                               42 ÷ 7 = 6\n8 × 9 = 72                             72 ÷ 8 = 9                               72 ÷ 9 = 8\n\nTo solve 56 ÷ 8, think: “8 times WHAT is 56?” → 8 × 7 = 56 → answer 7. Strong tables of 2–10 make division\nautomatic. This is the single biggest score-booster.\n\n3. Special rules\nRule                                                                          Example\nAny number ÷ 1 = the number itself                                            7÷1=7\nAny number ÷ itself = 1                                                       9÷9=1\n0 ÷ any number = 0                                                            0÷5=0\nA number can NEVER be divided by 0                                            5 ÷ 0 has no answer\n\n4. Remainders\nWhen things do not share out exactly, the leftover is the remainder.\n\nWorked example: 17 ÷ 5. Think tables of 5: 5 × 3 = 15 (5 × 4 = 20 is too big). Quotient = 3. Leftover: 17 − 15 = 2. So 17\n÷ 5 = 3 remainder 2.\n\nRule to check yourself: the remainder must always be SMALLER than the divisor.\n\nThe “round up or round down?” trap\nWord problems with remainders come in two flavours:\n\n•      “26 eggs, trays of 6. How many trays are needed to hold all the eggs?” → 4 trays hold 24, 2 eggs remain →\n       need 5 trays (round UP).\n•      “65 books, shelves of 9. How many shelves are completely full?” → 9 × 7 = 63 → 7 full shelves (ignore the 2\n       leftover books).\n\nRead the question, not just the numbers.\n\n5. Common traps\nTrap                                      Wrong thinking                             Right thinking\nSubtracting instead of dividing           24 ÷ 6 = 18                                24 ÷ 6 = 4\nForgetting the remainder                  26 ÷ 6 = 4 trays “enough”                  4 trays + 2 left → 5 needed\nMixing up dividend and divisor            reading 54 ÷ 9 as 9 ÷ 54                   big number first here\nRemainder bigger than divisor             19 ÷ 3 = 5 r 4                             19 ÷ 3 = 6 r 1\nQuotient vs divisor names                 calling the answer the divisor             answer = quotient\n\n6. High-frequency IMO question types\n1.     Direct facts: \"48 ÷ 6 = ___\" (tables 2–10).\n2.     Missing number: “___ ÷ 4 = 8” (multiply back: 8 × 4 = 32).\n3.     Remainder: “What is the remainder when 22 is divided by 4?”\n4.     Sharing word problem: money, laddoos, marbles among friends.\n5.     Grouping word problem: teams, boxes, rows, trays.\n6.     Two-step Achiever’s: “3 packets of 8 biscuits shared among 4 friends” (multiply first, then divide).\n7.     Fact-family: “9 × 7 = 63, so which is true?”\n\n7. Key facts checklist\n•      ☐ Tables 2–10 fluent both ways (6 × 7 = 42 AND 42 ÷ 7 = 6)\n•      ☐ Division = equal sharing = equal grouping = repeated subtraction\n•      ☐ Dividend ÷ Divisor = Quotient (+ Remainder)\n•      ☐ n ÷ 1 = n, n ÷ n = 1, 0 ÷ n = 0\n•      ☐ Remainder is always smaller than the divisor\n•      ☐ “Trays needed” rounds up; “completely full” rounds down\n\n8. Quick drill (10 questions)\n1.     36 ÷ 6 = ?\n2.     63 ÷ 7 = ?\n3.     8÷8=?\n4.     What is the remainder when 20 is divided by 3?\n5.     ___ ÷ 5 = 6. Missing number?\n6.     40 bananas shared among 8 monkeys. Each gets?\n7.     27 children make rows of 9. How many rows?\n8.     31 pencils, boxes of 4. How many FULL boxes?\n9.     Riya has 2 packets of 10 biscuits. She shares all among 5 friends. Each gets?\n10.    7 × 6 = 42. So 42 ÷ 6 = ?\n\nAnswers: 1) 6 2) 9 3) 1 4) 2 (3 × 6 = 18, 20 − 18 = 2) 5) 30 6) 5 7) 3 8) 7 (28 pencils; 3 left over) 9) 4 (20 ÷ 5) 10) 7"
},

"id": "note-imo-fractions",
"track": "SOF IMO — Math",
"title": "Notes: Fractions (Deep-Dive)",
"text": "SOF IMO — Topic Deep-Dive: Fractions\nFor Ambar, Class III CBSE\n\n1. What a fraction is\nA fraction is a part of a whole that has been cut into EQUAL parts. The word “equal” is what examiners test — 2\nunequal pieces are NOT halves.\n\nCut into                         Each part is called                                             Written as\n2 equal parts                    one-half                                                        1/2\n3 equal parts                    one-third                                                       1/3\n4 equal parts                    one-quarter (one-fourth)                                        1/4\n\nReading a fraction\nIn 3/4: - 3 on top = numerator = how many parts we are talking about - 4 below = denominator = how many equal\nparts in total\n\nMemory hook: Denominator is Down.\n\nWholes\n•    2 halves make 1 whole. 3 thirds make 1 whole. 4 quarters make 1 whole.\n•    So 2/2 = 3/3 = 4/4 = 1 whole. And 2 quarters make a half.\n\n2. Fraction of a collection\nRule: “1/n of a number” means DIVIDE the number by n.\n\nQuestion                                          Working                                 Answer\n1/2 of 16                                         16 ÷ 2                                  8\n1/3 of 12                                         12 ÷ 3                                  4\n1/4 of 20                                         20 ÷ 4                                  5\n1/5 of 15                                         15 ÷ 5                                  3\n\nStretch rule: for 2/3 of 12 — divide by the bottom, multiply by the top: 12 ÷ 3 = 4, then 4 × 2 = 8.\n\nWorked example: 3/4 of 16 → 16 ÷ 4 = 4 → 4 × 3 = 12.\n\n3. Comparing fractions\nFor fractions with 1 on top (unit fractions): The BIGGER the bottom number, the SMALLER the piece.\n\nThink of a roti: shared between 2 people you get a big piece (1/2); shared among 8 people you get a small piece\n(1/8).\n\n•    Order from smallest: 1/8 < 1/4 < 1/3 < 1/2\n•    “Which is greater, 1/3 or 1/5?” → 1/3 (fewer people sharing, bigger piece)\n\n4. “What fraction is shaded / left?” questions\n•    Shaded: parts shaded / total parts. 3 shaded out of 4 → 3/4.\n•    Left / not shaded: total − used, over total. Pizza of 8 slices, 3 eaten → 8 − 3 = 5 left → 5/8 left.\n•    Collections: 4 ripe mangoes out of 12 → 4/12 of the mangoes are ripe.\n•    Words: 2 cricket days out of 7 week days → 2/7 of the week.\n\n5. Common traps\nTrap                                      Wrong thinking                           Right thinking\nBigger denominator = bigger               1/8 > 1/2                                1/8 < 1/2 (more pieces = smaller\nfraction                                                                           piece)\nAnswering “eaten” when asked              ate 3 of 8 → 3/8 left                    5/8 left\n“left”\nFlipping the fraction                     3 of 4 parts = 4/3                       3/4\n“1/2 of 16” = 16 − 2                      14                                       16 ÷ 2 = 8\nNumerator/denominator mix-up              in 2/5 denominator is 2                  denominator is 5 (down)\nUnequal parts                             2 unequal parts = halves                 halves must be EQUAL\n\n6. High-frequency IMO question types\n1.     Name the fraction: \"each part of a roti cut in 2 equal parts is ___\".\n2.     Fraction of a number: \"1/2 of 16 = ___\".\n3.     Shaded/left fraction from a described figure or pizza story.\n4.     Compare unit fractions; order smallest to greatest.\n5.     Numerator/denominator identification.\n6.     Achiever’s: two fractions of one collection (“1/2 are mangoes, 1/3 are bananas, rest are apples”).\n7.     Fraction with money: “spent 1/4 of ₹40, how much left?”\n\n7. Key facts checklist\n•      ☐ Halves (2), thirds (3), quarters (4) — parts must be equal\n•      ☐ Numerator on top, denominator down\n•      ☐ 1/n of a number = number ÷ n\n•      ☐ 2/3 of a number = (number ÷ 3) × 2\n•      ☐ Bigger denominator → smaller unit fraction\n•      ☐ 2/2, 3/3, 4/4 all equal 1 whole; 2 quarters = 1 half\n•      ☐ “Left” = total minus used, over total\n\n8. Quick drill (10 questions)\n1.     1/2 of 18 = ?\n2.     1/4 of 16 = ?\n3.     1/3 of 15 = ?\n4.     Which is smaller: 1/4 or 1/6?\n5.     A cake has 6 equal slices, 1 is eaten. What fraction is left?\n6.     How many quarters make one whole?\n7.     In 4/7, what is the denominator?\n8.     2/3 of 9 = ?\n9.     Out of 20 marbles, 10 are blue. What fraction is blue?\n10.    Ambar spent 1/2 of ₹30. How much is left?\n\nAnswers: 1) 9 2) 4 3) 5 4) 1/6 5) 5/6 6) 4 7) 7 8) 6 (9 ÷ 3 = 3, 3 × 2 = 6) 9) 10/20 = 1/2 10) ₹15"
},

"track": "SOF IMO — Math",
"title": "Notes: Measurement (Deep-Dive)",
"text": "SOF IMO — Topic Deep-Dive: Measurement\nFor Ambar, Class III CBSE\n\n1. The three families\nWe measure                     Small unit                    Big unit                   Conversion\nLength / distance              centimetre (cm), metre        kilometre (km)             1 m = 100 cm; 1 km = 1000\n                               (m)                                                      m\nWeight                         gram (g)                      kilogram (kg)              1 kg = 1000 g\nCapacity (liquids)             millilitre (mL)               litre (L)                  1 L = 1000 mL\n\nMemory hook: kilo = 1000 (kilometre, kilogram). The odd one out is 1 m = 100 cm (only 100!). This is the most-tested\nconversion trap in Class III.\n\n2. Choosing a sensible unit\nThing                                                                                        Sensible unit\nLength of a pencil, eraser, handspan                                                         cm\nLength of a saree, height of a person, classroom                                             m\nDelhi to Agra, distance between cities                                                       km\nWeight of an eraser, a biscuit, a letter                                                     g\nWeight of a sack of rice, a watermelon, a person                                             kg\nMedicine in a spoon, a small syrup dose                                                      mL\nMilk, water in a bottle or bucket                                                            L\n\nTools: ruler/measuring tape for length, weighing balance for weight, measuring jug for capacity.\n\n3. Converting\nBig unit → small unit: MULTIPLY.\n\n•    5 m = 5 × 100 = 500 cm\n•    4 km = 4 × 1000 = 4000 m\n•    3 kg = 3000 g; 2 L = 2000 mL\n\nMixed units: convert the big part, then ADD the small part.\n\nWorked example: 7 m 25 cm = 700 cm + 25 cm = 725 cm (NOT 7025 — that mistake comes from treating m like km).\n\nHalves: half of 1 kg = 500 g; half a litre = 500 mL; half a metre = 50 cm.\n\n4. Adding and subtracting with units\nLine up the same units, carry/borrow in thousands (or hundreds for cm).\n\nWorked example 1 (add): 45 cm + 38 cm = 83 cm. Worked example 2 (subtract with mixed units): 6 kg − 2 kg 500 g.\n6 kg = 6000 g. 6000 − 2500 = 3500 g = 3 kg 500 g. Worked example 3 (capacity): 5 L − 2 L 250 mL = 5000 − 2250 =\n2750 mL = 2 L 750 mL.\n\nComparing\nConvert to the SAME unit first, then compare. - 1 kg vs 750 g → 1000 g vs 750 g → 1 kg is heavier. - 2500 g vs 2 kg →\n2500 vs 2000 → 2500 g is more. - 90 cm vs 1 m → 90 vs 100 → 90 cm is shorter.\n\n5. Common traps\nTrap                                      Wrong                                      Right\n1 m = 1000 cm                             1000                                       1 m = 100 cm\n7 m 25 cm = 7025 cm                       7025                                       725 cm\nAdding when asked “how much left”         1 L drink 400 mL → 1400 mL                 600 mL left\nComparing without converting              750 g > 1 kg “because 750 > 1”             convert: 1000 g > 750 g\nWrong unit match                          weight in litres, milk in metres           weight-kg, capacity-L, length-m\n100 cm vs 1 m confusion                   “100 cm is longer than 1 m”                they are EQUAL\n\n6. High-frequency IMO question types\n1.     Direct conversion: “1 km = ___ m”, “3 kg = ___ g”.\n2.     Best unit: “Which unit for the length of a pencil?”\n3.     Heavier/longer/more comparisons with mixed units (1 kg vs 750 g).\n4.     Add/subtract word problems: ribbons joined, sugar sold, milk left.\n5.     Equal cutting/filling: “20 m rope into 5 m pieces”, “2 L jug with 500 mL glasses”.\n6.     Ordering lightest to heaviest.\n7.     Achiever’s: daily use × days, then subtract from the total (oil can problem).\n\n7. Key facts checklist\n•      ☐ 1 m = 100 cm; 1 km = 1000 m\n•      ☐ 1 kg = 1000 g; 1 L = 1000 mL\n•      ☐ Half kg = 500 g; half L = 500 mL; half m = 50 cm\n•      ☐ Big → small unit: multiply\n•      ☐ Compare only after converting to the same unit\n•      ☐ cm for small lengths, m for medium, km for distances\n•      ☐ g for light things, kg for heavy; mL for spoonfuls, L for bottles/buckets\n\n8. Quick drill (10 questions)\n1.     1 m = ___ cm\n2.     2 km = ___ m\n3.     4 kg = ___ g\n4.     Half a litre = ___ mL\n5.     Which is heavier: 2 kg or 1800 g?\n6.     3 m 40 cm = ___ cm\n7.     A bottle has 1 L. Ambar drinks 250 mL. How much is left?\n8.     A 24 m rope is cut into 6 m pieces. How many pieces?\n9.     Which unit: distance from Delhi to Jaipur?\n10.    5 kg − 1 kg 500 g = ?\n\nAnswers: 1) 100 2) 2000 3) 4000 4) 500 5) 2 kg (2000 g) 6) 340 7) 750 mL 8) 4 9) km 10) 3 kg 500 g"
},

"id": "note-imo-time-money",

"title": "Notes: Time & Money (Deep-Dive)",
"text": "SOF IMO — Topic Deep-Dive: Time & Money\nFor Ambar, Class III CBSE\n\nPART A — TIME\n1. Reading the clock\n•      The short hand shows the HOUR; the long hand shows the MINUTES.\n•      Each number the minute hand passes = 5 minutes.\nMinute hand at               We say                                               Digital\n12                           o’clock                                              3:00\n3                            quarter past                                         3:15\n6                            half past                                            3:30\n9                            quarter to (the NEXT hour)                           3:45 = quarter to 4\n\nThe “quarter to” trap: 5:45 is quarter to 6, not quarter to 5. After the half-hour, we name the hour that is COMING.\n\n2. Units of time\nFact                                   Value\n1 hour                                 60 minutes\nHalf an hour                           30 minutes\nQuarter of an hour                     15 minutes\n1 day                                  24 hours\n1 week                                 7 days\n1 year                                 12 months, 365 days (366 in a leap year)\n\nMonth lengths: knuckle trick — Jan 31, Feb 28/29, Mar 31, Apr 30, May 31, Jun 30, Jul 31, Aug 31, Sep 30, Oct 31,\nNov 30, Dec 31. February is the shortest.\n\n3. Working with time\nDuration: count on from start to end. 7:30 → 9:30 is 2 hours. 4:15 → 5:00 is 45 minutes (count 4:15 → 4:30 → 4:45\n→ 5:00). End time: start + duration. Match starts at 10:00, lasts 3 and a half hours → 10:00 + 3 h = 1:00, + 30 min =\n1:30 (half past 1). Calendar days: “If 15 August is Friday, 17 August is?” — count 16 Sat, 17 Sunday. “After 3 days\nfrom Monday” → Tue, Wed, Thursday. Weeks to days: 2 weeks 3 days = 14 + 3 = 17 days.\n\nPART B — MONEY\n4. Rupees and paise\n•      ₹1 = 100 paise. So ₹2 = 200 paise; 50 paise + 50 paise = ₹1.\n•      Coins: ₹1, ₹2, ₹5, ₹10. Notes: ₹10, ₹20, ₹50, ₹100, ₹200, ₹500.\n•      Writing: ₹5.50 means 5 rupees and 50 paise.\n\n5. Adding money and making change\nAdding: line up the rupee point. Worked example: ₹5.50 + ₹3.75 → 50 p + 75 p = 125 p = ₹1.25 → ₹5 + ₹3 + ₹1.25 =\n₹9.25.\n\nChange = money given − cost. Worked example: 4 samosas at ₹8 each = ₹32. Paid with ₹50 → change = 50 − 32 =\n₹18. (Two steps: multiply, then subtract.)\n\nCounting mixed money: 3 coins of ₹5 + 2 notes of ₹10 = 15 + 20 = ₹35.\n\n6. Common traps\nTrap                                     Wrong                                    Right\nQuarter to 6 read as 5 :15               5:15                                     5:45\n1 hour = 100 minutes                     100                                      60 minutes\nCounting the start day                   Monday + 3 days = Wednesday              Thursday\nAnswering total spent when asked         paid 50 for 32 → “32”                    change ₹18\nchange\n₹5.50 + ₹3.75 without carrying paise     ₹8.25                                    ₹9.25 (125 p = ₹1.25)\nHour hand vs minute hand mixed up        long hand = hours                        short = hour, long = minutes\n\n7. High-frequency IMO question types\n1.     Read the clock: o’clock, half past, quarter past/to.\n2.     Conversions: hours-minutes, weeks-days, rupee-paise.\n3.     Duration and end time (“movie starts at 4, lasts 2 hours”).\n4.     Calendar: day after N days, days in a month, months order.\n5.     Total cost of several items; total of coins and notes.\n6.     Change from ₹10/₹20/₹50/₹100.\n7.     Achiever’s: two purchases then change; start time + hours = clock phrase.\n\n8. Key facts checklist\n•      ☐ 1 h = 60 min; half hour = 30 min; quarter hour = 15 min\n•      ☐ Quarter past = :15; half past = :30; quarter to = :45 of the NEXT hour\n•      ☐ 1 day = 24 h; 1 week = 7 days; 1 year = 12 months = 365 days\n•      ☐ February is the shortest month\n•      ☐ ₹1 = 100 paise\n•      ☐ Change = amount given − total cost\n\n9. Quick drill (10 questions)\n1.     3 hours = ___ minutes\n2.     Quarter past 8 = ___ (digital)\n3.     6:45 in words = ?\n4.     If today is Wednesday, what day is it after 2 days?\n5.     3 weeks = ___ days\n6.     ₹3 = ___ paise\n7.     ₹45 + ₹25 = ?\n8.     A toy costs ₹36. Ambar pays ₹50. Change = ?\n9.     School starts at 8:00 and the first break is at 10:30. How long until the break?\n10.    2 notes of ₹20 and 3 coins of ₹5 = ?\n\nAnswers: 1) 180 2) 8:15 3) quarter to 7 4) Friday 5) 21 6) 300 7) ₹70 8) ₹14 9) 2 and a half hours 10) ₹55 (40 + 15)"
},
