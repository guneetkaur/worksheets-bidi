"title": "Notes: Geometry & Data Handling (Deep-Dive)",
"text": "SOF IMO — Topic Deep-Dive: Geometry & Data Handling\nFor Ambar, Class III CBSE\n\nPART A — 2D SHAPES (flat shapes)\nA flat shape has sides (straight edges) and corners (where two sides meet).\n\nShape                  Sides            Corners           Remember\nTriangle               3                3                 tri = three\nSquare                 4                4                 ALL 4 sides equal\nRectangle              4                4                 opposite sides equal (2 pairs)\nPentagon               5                5                 penta = five\nHexagon                6                6                 hexa = six\nOctagon                8                8                 octa = eight (like octopus)\nCircle                 0                0                 no straight side, no corner\n\nSquare vs rectangle trap: both have 4 sides and 4 corners; only the square has ALL sides equal.\n\nStretch idea — perimeter: the distance all around a shape. A square of side 6 cm has perimeter 6 + 6 + 6 + 6 = 24 cm.\n\nPART B — 3D SHAPES (solid shapes)\nSolid shapes have faces (flat surfaces), edges (where two faces meet) and corners/vertices (points).\n\nSolid              Faces                             Edges               Corners           Everyday example\nCube               6                                 12                  8                 dice\nCuboid             6                                 12                  8                 brick, matchbox, book\nSphere             0 flat (1 curved surface)         0                   0                 ball, football\nCylinder           2 flat + 1 curved                 0 straight          0                 tin can, gas cylinder\nCone               1 flat + 1 curved                 0 straight          1 point (apex)    ice-cream cone, joker’s cap\n\nRolling and sliding: sphere only rolls; cube/cuboid only slide; cylinder and cone can roll AND slide (they have both\ncurved and flat surfaces).\n\n2D vs 3D trap: circle, square, triangle are FLAT (2D); sphere, cube, cone are SOLID (3D). A dice is a cube, not a square.\n\nPART C — PATTERNS\n•       Repeating patterns: circle, square, circle, square, ___ → circle. Find the repeating block first.\n•       Growing patterns: 2, 4, 6, 8 (+2); 5, 10, 15 (+5); A, AB, ABC (one letter added).\n•       Backward patterns: Z, Y, X, W → V; 60, 55, 50 → 45.\n•       Stretch: 1, 4, 9, 16, 25 (square numbers: 1×1, 2×2, 3×3, …).\n\nPART D — DATA HANDLING\nPictographs\nA pictograph uses symbols. Always read the key first — one symbol may stand for MORE than one thing.\n\nWorked example: Key: each symbol = 2 children. Mango row has 5 symbols → 5 × 2 = 10 children like mango.\nComparison example: each symbol = 5 trees; Class 3 has 4 symbols (20 trees), Class 4 has 6 symbols (30 trees) →\nClass 4 planted 30 − 20 = 10 more.\n\nTally charts\nTally marks are counted in bundles of 5: four lines with the fifth across (||||).\n\n•      |||| = 4, |||| (crossed) = 5, |||| || = 7, |||| |||| = 10.\n\nReading tables\n“Most/fewest votes” → compare the numbers. “How many in all” → ADD every row (Red 8 + Blue 6 + Green 4 = 18).\n\nCommon traps\nTrap                                      Wrong                                     Right\nIgnoring the pictograph key               5 symbols = 5 children                    5 × 2 = 10 (key says 2 each)\nCube faces vs corners                     cube has 8 faces                          6 faces, 8 corners, 12 edges\nSquare = rectangle mixed up               rectangle has all sides equal             only square does\nCircle “has 1 side”                       1                                         0 straight sides, 0 corners\n“How many more” answered with             adds the two rows                         subtract the two rows\ntotal\nCone corners                              0                                         1 point (apex)\n\nHigh-frequency IMO question types\n1.     Sides/corners of a named 2D shape; odd one out (2D among 3D).\n2.     Faces/edges/corners of cube, cuboid; everyday-object shape matching.\n3.     Which solid rolls / slides / both.\n4.     What comes next in a shape, number or letter pattern.\n5.     Pictograph with a key: value of a row, difference between rows.\n6.     Tally count; most/fewest from a small table; total votes.\n\nKey facts checklist\n•      ☐ Triangle 3, square/rectangle 4, pentagon 5, hexagon 6, octagon 8, circle 0\n•      ☐ Cube and cuboid: 6 faces, 12 edges, 8 corners\n•      ☐ Sphere: no flat face, no edge, no corner\n•      ☐ Cylinder: 2 flat faces; cone: 1 flat face + 1 point\n•      ☐ Read the pictograph KEY before counting\n•      ☐ Tally |||| (crossed) = 5\n\nQuick drill (10 questions)\n1.     How many corners does a rectangle have?\n2.     How many faces does a cube have?\n3.     Which solid has no corners and no edges at all?\n4.     What comes next: 3, 6, 9, 12, ___?\n5.     A cone has how many flat faces?\n6.     Pictograph key: 1 symbol = 4 books. A row shows 3 symbols. How many books?\n7.     Tally marks |||| ||| stand for?\n8.     Which shape has 6 sides?\n9.     Votes: Ludo 9, Chess 4, Carrom 6. Which got the most?\n10.    What comes next: square, circle, circle, square, circle, circle, ___?\n\nAnswers: 1) 4 2) 6 3) sphere 4) 15 5) 1 6) 12 7) 8 8) hexagon 9) Ludo 10) square"
},

"text": "SOF IEO Cheat Sheet — Class III\nTense table\nHelper                Who                            Time       Example\ndo                    I, you, we, they               present    Do they play?\ndoes                  he, she, it                    present    Does she sing? (verb: no -s after does)\ndid                   everyone                       past       Did Ravi go?\nis / am / are         one / I / many                 present    He is; I am; they are\nwas / were            one / many                     past       She was; we were\nhas / have            one / many                     present    She has; they have\n\nSignal words: yesterday, ago, last → past; every day, always → present + -s for one doer; now, Look! → is/am/are +\n-ing.\n\nArticle rules\n•       a + consonant SOUND: a book, a university, a one-rupee coin\n•       an + vowel SOUND: an apple, an hour, an honest boy\n•       the = particular / one-of-a-kind: the sun, the Ganga, the Taj Mahal, the best\n•       No article: games, meals, languages, milk/water in general\n\nTop prepositions\nPlace                                                                     Time\nin the box, on the wall, under the bed                                    at 8 o’clock, at night\nabove (higher), behind (at back), beside (next to)                        on Sunday, on 14 June\nbetween TWO things, at the bus stop                                       in June, in winter, in the morning\n\nDegrees of comparison\nPositive                            Comparative (two + than)                Superlative (the + group)\ntall / big / happy                  taller / bigger / happier               tallest / biggest / happiest\nbeautiful                           more beautiful                          most beautiful\ngood / bad                          better / worse                          best / worst\nfar / little                        farther / less                          farthest / least\n\nNever “more bigger” or “most tastiest”.\n\n20 must-know synonym / antonym pairs\nSynonyms: happy-glad, big-large, small-tiny, quick-fast, begin-start, end-finish, shout-yell, neat-tidy, gift-present,\nweep-cry. Antonyms: hot-cold, day-night, open-shut, empty-full, buy-sell, always-never, heavy-light, noisy-quiet,\nremember-forget, victory-defeat."

etrol/diesel; cycle needs no fuel. Communication: letter,\nphone, TV, newspaper, internet. Personal = one person; Mass = many (TV, newspaper).\n\nEarth & Universe\nSun = star (heat + light). Moon = Earth’s natural satellite; reflects Sun’s light. 8 planets: Mercury closest, Jupiter\nlargest, we live on Earth (Mercury, Venus, Earth, Mars…). Rotation (spin) → day & night. Revolution (round Sun) →\none year. Made by people = artificial satellite."

const GK_NOTES = [{"id": "note-gk-u1", "track": "SOF IGKO — GK", "title": "Notes: GKO Unit 1 (Deep-Dive)", "text": "# SOF GKO Unit 1 — Comprehensive Topic Guide\n**For Ambar, Class III CBSE**\n\n---\n\n## SECTION 1: INDIAN GEOGRAPHY\n\n### 1.1 States & Capitals\n**India has 28 states and 8 Union Territories**\n\n**Key capitals to memorize:**\n- North: Delhi (National Capital), Jaipur (Rajasthan), Chandigarh (Punjab/Haryana)\n- South: Bangalore (Karnataka), Chennai (Tamil Nadu), Hyderabad (Telangana), Thiruvananthapuram (Kerala)\n- East: Kolkata (West Bengal), Patna (Bihar)\n- West: Mumbai (Maharashtra), Gandhinagar (Gujarat)\n- Central: Bhopal (Madhya Pradesh)\n\n### 1.2 National Symbols\n- **National Animal:** Tiger (strength & power)\n- **National Bird:** Peacock (beauty & grace)\n- **National Flower:** Lotus (purity & enlightenment)\n- **National Fruit:** Mango (king of fruits)\n- **National Emblem:** Lion Capital of Ashoka (4 lions, Dharma Chakra)\n- **National Sport:** Hockey\n\n### 1.3 Geography Features\n- **Longest River:** Ganges (2525 km) — flows from Himalayas to Bay of Bengal, sacred in Hinduism\n- **Tallest Mountain Range:** Himalayas — northern boundary, contains Mount Everest (world's tallest)\n- **Largest Desert:** Thar Desert (Rajasthan, northwest)\n- **Oceans/Seas:** Arabian Sea (west), Bay of Bengal (east), Indian Ocean (south)\n\n### 1.4 Landmarks & Monuments\n- **Taj Mahal (Agra)** — mausoleum, UNESCO World Heritage site, built by Shah Jahan\n- **Red Fort (Delhi)** — ancient fortification, India Gate nearby\n- **Statue of Unity (Vadodara, Gujarat)** — world's tallest statue\n- **India Gate (Delhi)** — war memorial\n\n---\n\n## SECTION 2: INDIAN HISTORY\n\n### 2.1 Independence & Important Dates\n- **15 August 1947:** India gained independence from British rule\n- **26 January 1950:** Indian Constitution came into force (Republic Day)\n- **British ruled India for ~200 years (1747-1947)**\n\n### 2.2 Freedom Fighters\n- **Mahatma Gandhi** — Father of the Nation, led non-violent independence movement (Satyagraha)\n- **Jawaharlal Nehru** — First Prime Minister of India, nationalist leader\n- **Sardar Vallabhbhai Patel** — Iron Man of India, unified princely states\n- **Dr. Bhimrao Ambedkar** — Architect of the Indian Constitution\n- **Bhagat Singh, Lala Lajpat Rai, Subhas Chandra Bose** — Revolutionary freedom fighters\n\n### 2.3 Ancient Indian Empires\n- **Mauryan Empire (322-185 BCE)** — Founded by Chandragupta Maurya, Ashoka's reign, spread Buddhism\n- **Mughal Empire (1526-1857 CE)** — Islamic empire, Akbar & Shah Jahan were great emperors\n- **Gupta Empire (320-550 CE)** — Known as 'Golden Age of India', advances in art, science, mathematics\n\n---\n\n## SECTION 3: INDIAN CIVICS\n\n### 3.1 Constitution & Government\n- **Indian Constitution:** Framed by Dr. Ambedkar and committee, came into force 26 Jan 1950\n- **India is:** A democratic republic — ruled by people through representatives\n- **Fundamental Rights:** Equality, freedom, education, property, etc.\n- **Fundamental Duties:** Respect Constitution, obey laws, protect sovereignty\n\n### 3.2 Structure of Government\n- **President:** Head of State (ceremonial role)\n- **Prime Minister:** Head of Government (executive authority)\n- **Parliament:** Lok Sabha (Lower House) + Rajya Sabha (Upper House)\n\n### 3.3 The Indian Flag (Tricolor)\n- **Saffron (top):** Courage, sacrifice, patriotism\n- **White (middle):** Peace, truth, honesty\n- **Green (bottom):** Fertility, growth, prosperity\n- **Blue Chakra (center):** Progress, advancement (24 spokes = 24 hours)\n\n### 3.4 National Anthem & Song\n- **National Anthem:** Jana Gana Mana (by Rabindranath Tagore) — 52 seconds\n- **National Song:** Vande Mataram (call to worship motherland)\n\n---\n\n## SECTION 4: CULTURE & FESTIVALS\n\n### 4.1 Major Festivals\n- **Diwali (Oct-Nov):** Festival of Lights, celebrates victory of good over evil, lights, fireworks, new clothes\n- **Holi (Feb-Mar):** Festival of Colors, celebrates arrival of spring, playful color throwing\n- **Eid (Islamic):** Celebrates end of Ramadan (fasting month), prayers, feasts\n- **Christmas (25 Dec):** Celebrates birth of Jesus, decorations, gifts, celebrations\n- **Pongal (14 Jan):** Harvest festival (Tamil Nadu), thank sun god\n- **Navratri (Sep-Oct):** 9 nights celebrating Goddess Durga, Dandiya dances\n\n### 4.2 Indian Culture & Traditions\n- **Joint Family System:** Multiple generations living together, respect for elders\n- **Yoga:** Ancient Indian practice for physical/mental wellness, UNESCO Intangible Heritage\n- **Languages:** Hindi (official), 22 scheduled languages, English widely spoken\n- **Cuisine:** Diverse regional foods (North: naan, dal; South: dosa, idli)\n\n### 4.3 Famous Indian Scientists & Scholars\n- **Aryabhata:** Mathematician, invented zero, calculated pi value\n- **CV Raman:** Physicist, Nobel Prize winner (Raman Effect)\n- **Ramakrishnan Pillai:** Mathematician\n- **Rabindranath Tagore:** Writer, philosopher, Nobel Prize in Literature (first Asian)\n\n---\n\n## SECTION 5: SPORTS & INVENTIONS\n\n### 5.1 Sports in India\n- **National Sport:** Hockey\n- **Popular Sports:** Cricket (most followed), badminton, kabaddi, wrestling, football\n- **Famous Athletes:** Virat Kohli (cricket), PV Sindhu (badminton), Neeraj Chopra (javelin)\n- **International Events:** World Cup (cricket), Olympics, Asian Games, Commonwealth Games\n\n### 5.2 Indian Inventions & Contributions\n- **Zero:** Invented by Aryabhata, revolutionized mathematics and science\n- **Chess:** Originated in India as Chaturanga\n- **Yoga:** Ancient practice for holistic wellness\n- **Decimal System:** Indian mathematicians developed this\n- **IIT & ISRO:** Institutes for advanced technology and space exploration\n\n### 5.3 Modern India\n- **ISRO:** Indian Space Research Organization, sent missions to Moon and Mars\n- **IT Industry:** India is global IT hub, software exports, Bangalore 'Silicon Valley of India'\n- **Renewable Energy:** India investing in solar & wind power\n\n---\n\n## KEY FACTS CHECKLIST FOR AMBAR\n\n- [ ] India's capital: Delhi\n- [ ] National animal: Tiger; National bird: Peacock; National flower: Lotus; National fruit: Mango\n- [ ] Independence Day: 15 August 1947\n- [ ] Republic Day: 26 January 1950\n- [ ] Father of Nation: Mahatma Gandhi\n- [ ] First Prime Minister: Jawaharlal Nehru\n- [ ] Constitution framed by: Dr. Ambedkar\n- [ ] National Sport: Hockey\n- [ ] Longest river: Ganges\n- [ ] Tallest mountain range: Himalayas\n- [ ] Largest desert: Thar Desert\n- [ ] Taj Mahal: Built by Shah Jahan in Agra\n- [ ] Tricolor meaning: Saffron (courage), White (peace), Green (fertility)\n- [ ] States + UTs: 28 states + 8 Union Territories\n- [ ] Major festivals: Diwali, Holi, Eid, Christmas, Pongal\n- [ ] Zero invented by: Aryabhata\n- [ ] India is a: Democratic Republic\n\n---\n\n## QUICK REVISION DRILL\n\n**Answer these 10 questions in 5 minutes:**\n\n1. What is the capital of India?\n2. Which animal is the national animal?\n3. When did India gain independence?\n4. Who is called the Father of the Nation?\n5. What is the national sport of India?\n6. Which is the longest river in India?\n7. What does the saffron color in the flag represent?\n8. Who was the first Prime Minister of India?\n9. Which is the highest mountain range in India?\n10. Which festival is known as the Festival of Lights?\n\n**Answers:**\n1. Delhi\n2. Tiger\n3. 15 August 1947\n4. Mahatma Gandhi\n5. Hockey\n6. Ganges\n7. Courage & sacrifice\n8. Jawaharlal Nehru\n9. Himalayas\n10. Diwali\n\n---\n\n**Good luck with SOF GKO, Ambar! 🇮🇳📚**"}, {"id": "note-gk-full", "track": "SOF IGKO — GK", "title": "Notes: IGKO Full Syllabus (Deep-Dive)", "text": "# SOF IGKO Class 3 — Complete Syllabus Guide\n**All 11 Topics + Current Affairs + Life Skills**\n\n---\n\n## SECTION 1: ME AND MY SURROUNDINGS\n\n### Family & Home\n- **Family structure:** Father, mother, siblings, grandparents, cousins\n- **Family roles:** Parents provide love, care, education; siblings are friends and companions\n- **Home:** A safe place to live, basic needs (food, water, shelter, clothing)\n- **Responsibilities:** Keeping room clean, helping parents, listening to elders\n\n### School & Community\n- **School:** Place of learning, teachers teach, friends play together, principal is head\n- **School rules:** Follow discipline, respect teachers, help classmates\n- **Community:** Neighborhood, people living together, postman, milkman, police\n- **Professions:** Doctor, teacher, farmer, shopkeeper, engineer, police officer\n\n### Daily Routines\n- **Hygiene:** Brush teeth twice, bathe daily, wash hands before eating\n- **Good habits:** Sleep on time, eat healthy food, listen to parents\n- **Bad habits:** Lying, hitting, wasting food, staying up late\n\n---\n\n## SECTION 2: PLANTS AND ANIMALS (Extended)\n\n### Plant Types & Parts\n- **Types:** Trees (neem, mango, banyan), shrubs (rose, hibiscus), herbs (mint, basil), climbers (money plant), creepers (watermelon)\n- **Parts:** Root (absorbs water), stem (supports plant), leaf (makes food), flower (reproduces), fruit (protects seeds)\n- **Uses:** Food (rice, dal, vegetables), medicine (tulsi), wood (furniture), oxygen\n\n### Animals & Classification\n- **Habitats:** Land (lion, deer, cow), water (fish, whale), air (eagle, parrot)\n- **Food habits:** Herbivore (cow, deer), carnivore (tiger, eagle), omnivore (human, bear, crow)\n- **Groups:** School of fish, flock of birds, herd of cattle, colony of ants\n- **Pets:** Dog, cat, rabbit, parrot, goldfish\n- **Wild animals:** Tiger, lion, elephant, zebra, cheetah\n- **Birds:** Sparrow, crow, peacock, pigeon, owl\n\n### Body Parts & Adaptation\n- **Fish:** Fins (swim), gills (breathe underwater), scales (protection)\n- **Birds:** Wings (fly), feathers (insulation), beaks (eat)\n- **Mammals:** Four legs (move), fur (warmth), different teeth (eat varied food)\n\n---\n\n## SECTION 3: INDIA AND THE WORLD\n\n*(See deep-dive sections on Geography, History, Civics, Sports in GKO Unit 1 guide)*\n\n### Key Facts Quick Recap\n- Capital: Delhi\n- National animal: Tiger\n- National bird: Peacock\n- Independence: 15 August 1947\n- National sport: Hockey\n- Longest river: Ganges\n- Tallest mountains: Himalayas\n\n### Other Countries\n- **USA:** Capital Washington DC, Statue of Liberty\n- **UK:** Capital London, Big Ben\n- **China:** Capital Beijing, Great Wall\n- **Australia:** Capital Canberra, Sydney Opera House\n- **France:** Capital Paris, Eiffel Tower\n\n---\n\n## SECTION 4: SCIENCE AND TECHNOLOGY\n\n### Basic Physics\n- **Light:** Makes things visible, creates shadows, travels straight\n- **Heat:** Makes things warm, comes from sun, fire, friction\n- **Sound:** Made by vibrations, travels through air/water, we hear with ears\n- **Electricity:** Powers lights, fans, TV; comes from power plants or batteries\n- **Magnets:** Attract iron, have north and south poles\n\n### Earth & Space\n- **Earth:** Round planet, rotates (day-night), revolves around sun (seasons)\n- **Moon:** Orbits earth, light comes from sun, causes tides\n- **Sun:** Star, center of solar system, gives light and heat\n- **Stars:** Distant suns, twinkle at night\n- **Planets:** Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune\n\n### Simple Machines\n- **Lever:** Simple stick to lift heavy objects (seesaw, crowbar)\n- **Pulley:** Rope over wheel (well, lifting)\n- **Incline:** Slope to move things up (ramp)\n- **Wheel:** Round object that rolls (bicycle, car)\n\n### Inventions\n- **Wheel:** Movement, transport\n- **Fire:** Warmth, cooking, light\n- **Paper:** Writing, books\n- **Printing press:** Books, newspapers\n- **Bulb (Edison):** Electric light\n- **Telephone (Bell):** Communication\n- **Steam engine:** Industry, trains\n\n---\n\n## SECTION 5: LANGUAGE AND LITERATURE\n\n### Grammar Basics\n- **Nouns:** Names (cat, Delhi, milk), person (boy, teacher), place (school, park), thing (pen, ball)\n- **Verbs:** Action words (run, jump, eat, sleep, write, read, talk)\n- **Adjectives:** Describing words (big, small, red, happy, beautiful)\n- **Pronouns:** I, you, he, she, it, we, they (replace nouns)\n\n### Stories & Morals\n- **Panchatantra Tales:** Lion and Mouse (help when needed), Tortoise and Hare (slow and steady wins), Clever Fox stories\n- **Moral:** Honesty, hard work, friendship, helping others\n- **English stories:** Goldilocks and Three Bears, Little Red Riding Hood\n- **Common rhymes:** Humpty Dumpty, Jack and Jill, Twinkle Twinkle Little Star\n\n### Literature\n- **Poetry:** Verses with rhythm and rhyme (poems, nursery rhymes)\n- **Story:** Narrative with characters, plot, ending (fairy tales, fables)\n- **Author:** Person who writes (Dr. Seuss, Enid Blyton)\n\n---\n\n## SECTION 6: EARTH AND ITS ENVIRONMENT\n\n### Geography Features\n- **Mountains:** High land (Himalayas, Western Ghats), provide water, minerals\n- **Rivers:** Water bodies (Ganges, Brahmaputra, Nile), provide water, fish, transport\n- **Oceans:** Saltwater (Atlantic, Pacific, Indian), home to fish, whales\n- **Deserts:** Dry land (Sahara, Thar), hot, sandy, few plants\n- **Forests:** Trees and plants (tropical, temperate), home to animals\n- **Islands:** Land surrounded by water (Sri Lanka, Madagascar)\n\n### Weather & Seasons\n- **Weather:** Sun (hot, light), rain (wet, water), wind (air movement), snow (cold)\n- **Seasons:** Summer (hot), winter (cold), spring (new growth), autumn (leaves fall)\n- **Monsoon:** Heavy rain season in India (Jun-Sep)\n- **Climate:** Long-term weather pattern of a region\n\n### Water Cycle\n- **Evaporation:** Water from sea/lakes becomes vapor (heat from sun)\n- **Condensation:** Vapor cools and forms clouds\n- **Precipitation:** Rain/snow falls from clouds\n- **Collection:** Water goes to rivers, seas (cycle repeats)\n\n### Environment Care\n- **Pollution:** Dirty air (smoke), dirty water (waste), noise\n- **Conservation:** Save water, save electricity, plant trees, recycle\n- **Recycling:** Reuse paper, plastic, glass instead of throwing away\n- **Green practices:** Use less plastic, walk/cycle, eat local food\n\n---\n\n## SECTION 7: TRANSPORT AND COMMUNICATION\n\n### Transportation\n- **Land:** Cars, buses, trains, bicycles, motorcycles\n- **Water:** Ships, boats, submarines, ferries\n- **Air:** Airplanes, helicopters, drones\n- **Fastest:** Airplane\n- **Cheapest:** Walking, cycling\n- **Most common:** Bus, car, bicycle\n- **Rail network:** Connects cities, carries many people\n\n### Communication\n- **Face-to-face:** Talking to someone nearby (direct, fastest)\n- **Telephone:** Talk to someone far away (phone call, WhatsApp call)\n- **Internet:** Email, video call, social media (Skype, Zoom)\n- **Postal:** Letter, postcard (postman delivers to home)\n- **Media:** Newspaper (news), TV (news + entertainment), radio (audio)\n- **Mobile:** Phone with apps (messages, calls, internet)\n\n### Postal System\n- **Postman:** Delivers mail to homes\n- **Post office:** Place to buy stamps, send letters\n- **Stamp:** Shows postage paid\n- **Envelope:** Container for letters\n\n---\n\n## SECTION 8: SPORTS\n\n*(See GKO Unit 1 deep-dive for detailed coverage)*\n\n### Major Sports\n- **National Sport:** Hockey\n- **Most played:** Cricket (India), football (worldwide)\n- **Olympic sports:** Basketball, swimming, wrestling, badminton, javelin\n- **Traditional Indian:** Kabaddi, kho-kho, wrestling\n\n### Sportspeople & Equipment\n- **Cricket:** Bat, ball, wickets (11 players)\n- **Football:** Ball, goal (11 players)\n- **Badminton:** Racket, shuttlecock (2-4 players)\n- **Basketball:** Ball, basket (5 players per side)\n- **Tennis:** Racket, ball (2-4 players)\n\n---\n\n## SECTION 9: MATHS FUN\n\n### Number Patterns\n- **Even numbers:** 2, 4, 6, 8, 10 (divisible by 2)\n- **Odd numbers:** 1, 3, 5, 7, 9 (not divisible by 2)\n- **Counting:** 1, 2, 3... (natural numbers)\n- **Sequence:** What comes next? 2, 4, 6, ? → 8\n\n### Basic Operations\n- **Addition:** 5 + 3 = 8 (combine)\n- **Subtraction:** 8 - 3 = 5 (take away)\n- **Multiplication:** 3 × 4 = 12 (repeated addition)\n- **Division:** 12 ÷ 3 = 4 (share equally)\n\n### Shapes & Sizes\n- **Shapes:** Circle (round), square (4 equal sides), triangle (3 sides), rectangle (4 sides)\n- **Bigger/smaller:** 10 > 5 (10 is bigger than 5)\n- **Measurement:** Length (long/short), weight (heavy/light), height (tall/short)\n\n### Logic Puzzles\n- **Odd one out:** Which doesn't belong? Apple, orange, car, banana → car (not fruit)\n- **Analogies:** 2 is to 4 as 3 is to ? → 6 (both double)\n- **Sequence:** 5, 10, 15, ? → 20 (add 5 each time)\n\n---\n\n## SECTION 10: LIFE SKILLS\n\n### Moral Values\n- **Honesty:** Tell the truth even if it's hard\n- **Courage:** Be brave, face fears, stand up for right\n- **Kindness:** Help others, be nice, share\n- **Respect:** Honor teachers, elders, others' feelings\n- **Patience:** Wait calmly, don't rush, listen to others\n\n### Team Work\n- **Cooperation:** Work together toward common goal\n- **Sharing:** Divide tasks, share resources\n- **Supporting:** Help friends when they struggle\n- **Communication:** Talk clearly, listen to others\n\n### Environmental Sensitivity\n- **Reduce waste:** Use less paper, plastic, water\n- **Reuse:** Use things again instead of throwing away\n- **Recycle:** Collect recyclables (glass, paper, plastic)\n- **Protect animals:** Don't hurt animals, save habitat\n- **Clean surroundings:** Keep school, home, park clean\n\n### Communication Skills\n- **Listen:** Pay attention when others speak\n- **Speak clearly:** Use proper words, polite tone\n- **Body language:** Smile, maintain eye contact, stand tall\n- **Empathy:** Understand others' feelings\n\n### Leadership\n- **Take initiative:** Start tasks without being asked\n- **Make decisions:** Choose wisely, consider others\n- **Be responsible:** Do assigned tasks well\n- **Inspire others:** Set good example, motivate friends\n\n### Time Management\n- **Plan:** Know what needs to be done\n- **Prioritize:** Do important things first\n- **Schedule:** Allocate time for study, play, rest, meals\n- **Punctuality:** Be on time, don't waste time\n\n---\n\n## SECTION 11: CURRENT AFFAIRS & DEVELOPMENTS\n\n### Recent Events (2025-2026)\n- **Sports:** Cricket World Cup, Olympics (Paris 2024), Asian Games\n- **Technology:** New inventions, AI developments, space missions\n- **Environment:** Climate change, natural disasters, conservation efforts\n- **Festivals:** Diwali, Holi, Independence Day celebrations\n- **National holidays:** Republic Day (26 Jan), Independence Day (15 Aug)\n\n### World Events\n- **International observances:** World Environment Day (5 June), World Water Day (22 March)\n- **Natural phenomena:** Eclipses, meteor showers\n- **Achievements:** New records, discoveries, inventions\n\n---\n\n## KEY FACTS CHECKLIST\n\n- [ ] India's capital, national animal, bird, flower, fruit, sport\n- [ ] Independence & Republic Day dates\n- [ ] Types of plants and their functions\n- [ ] Animal classification (herbivore, carnivore, omnivore)\n- [ ] Parts of plant and their jobs\n- [ ] Five sense organs and uses\n- [ ] Weather: sun, rain, wind, snow\n- [ ] Water cycle: evaporation, condensation, precipitation\n- [ ] Professions: doctor, teacher, police, farmer, engineer\n- [ ] Transportation types: land, water, air\n- [ ] Communication methods: phone, email, postal, face-to-face\n- [ ] Sports: national sport (hockey), popular sports\n- [ ] Planets and stars (basic)\n- [ ] Basic math: addition, subtraction, multiplication, division\n- [ ] Moral values: honesty, kindness, respect, courage\n- [ ] Life skills: teamwork, communication, time management\n\n---\n\n## QUICK REVISION DRILL (20 Questions)\n\n1. What is the capital of India?\n2. Name the national bird.\n3. Which plant part absorbs water?\n4. A herbivore eats ___.\n5. Which animal is our national animal?\n6. What is the longest river in India?\n7. When is Independence Day?\n8. What is the national sport?\n9. Name a machine used at home.\n10. How many planets are there?\n11. What is a postman?\n12. Name a sport played in Olympics.\n13. What does a doctor do?\n14. Name one moral value.\n15. What is recycling?\n16. How many sides does a triangle have?\n17. When is monsoon in India?\n18. Name a wild animal.\n19. What helps us to hear?\n20. What is a shadow?\n\n**Answers:**\n1. Delhi | 2. Peacock | 3. Root | 4. Plants | 5. Tiger | 6. Ganges | 7. 15 August | 8. Hockey | 9. Fan/bulb/refrigerator | 10. 8 | 11. Delivers mail | 12. Basketball/swimming/badminton | 13. Treats sick people | 14. Honesty/kindness | 15. Reusing materials | 16. 3 | 17. June-September | 18. Lion/tiger/elephant | 19. Ears | 20. Light blocked by object\n\n---\n\n**Good luck with SOF IGKO, Ambar! Master all 11 topics! 🇮🇳📚**"}];

const store = {
  get history() { try { return JSON.parse(localStorage.getItem("ambar-results") || "[]"); } catch { return []; } },
  save(rec) { const h = this.history; h.push(rec); localStorage.setItem("ambar-results", JSON.stringify(h)); },
  allFor(id) { return this.allAttempts().filter(r => r.id === id); },
  // One row per worksheet+date. Repeated "Finish & Check" presses on the same
  // sheet on the same day are the SAME attempt — keep the best score, count the tries.
  allAttempts() {
    const byKey = new Map();
    this.history.concat(remoteHistory).forEach(r => {
      const k = r.id + "|" + r.date;
      const prev = byKey.get(k);
      if (!prev) { byKey.set(k, { ...r, tries: 1 }); return; }
      prev.tries++;
      if ((r.score || 0) > (prev.score || 0)) { prev.score = r.score; prev.totalTime = r.totalTime; }
    });
    return [...byKey.values()].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  },
  bestFor(id) {
    const h = this.allFor(id);
    return h.length ? h.reduce((a, b) => b.score > a.score ? b : a) : null;
  }
};

// ---- pull done-sheet history back from the GitHub CSV ----
function parseCsvText(text) {
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (field !== "" || row.length) { row.push(field); rows.push(row); row = []; field = ""; }
      if (ch === "\r" && text[i+1] === "\n") i++;
    } else field += ch;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}
let remoteStatus = "Results sync not set up on this device — enter repo + token below and Save.";
async function loadRemoteHistory() {
  const cfg = gh.cfg; if (!cfg || !cfg.repo || !cfg.token) return;
  remoteStatus = "Checking GitHub for results…";
  try {
    const res = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/results/results.csv`,
      { headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json" } });
    if (res.status === 404) { remoteStatus = "No results/results.csv in the repo yet — it appears after the first synced attempt (or upload one)."; return; }
    if (!res.ok) { remoteStatus = `Could not read results from GitHub (HTTP ${res.status}) — check the token.`; return; }
    const j = await res.json();
    const rows = parseCsvText(b64decode(j.content));
    const head = rows[0]; const col = n => head.indexOf(n);
    const iW = col("worksheet"), iD = col("date"), iM = col("marks"), iT = col("total_time_s"), iS = col("submitted_at");
    const groups = {};
    rows.slice(1).forEach(r => {
      const ws = WORKSHEETS.find(w => w.title === r[iW]); if (!ws) return;
      const key = r[iW] + "|" + r[iD] + "|" + (iS >= 0 ? r[iS] : "");
      const g = groups[key] = groups[key] || { id: ws.id, date: r[iD], score: 0, max: ws.marks, totalTime: r[iT] };
      g.score += parseFloat(r[iM]) || 0;
    });
    remoteHistory = Object.values(groups).map(g => (g.score = Math.round(g.score * 10) / 10, g));
    remoteStatus = `Loaded ${remoteHistory.length} attempt${remoteHistory.length === 1 ? "" : "s"} from GitHub ✓`;
    // refresh whichever view is open
    if (!$("home").classList.contains("hidden")) {
      renderHome();
      if (!$("catalogue").classList.contains("hidden")) renderCatalogue();
    }
  } catch (e) { remoteStatus = "Offline — showing this device's results only."; }
}

function openWs(id) {
  current = WORKSHEETS.find(w => w.id === id);
  timing = { startedAt: null, submittedAt: null, sections: {} };
  lastRows = null;
  submitted = false;
  const sb = $("submitBtn");
  if (sb) { sb.textContent = "Finish & Check"; sb.disabled = false; sb.style.opacity = 1; }
  $("home").classList.add("hidden");
  $("ws").classList.remove("hidden");
  setWsChrome(true);
  $("resultBox").style.display = "none";
  $("keypanel").style.display = "none";
  $("pin").value = ""; $("pinMsg").textContent = "";
  $("adminBox").removeAttribute("open");
  $("wsTitle").textContent = (current.track.startsWith("Mental Math") ? "Math Practice Sheet — " : "") + current.title;
  $("wsSub").innerHTML = `Class III &bull; ${current.track} &bull; Total ${current.marks} marks`;
  $("date").valueAsDate = new Date();
  document.title = current.title;
  $("sections").innerHTML = current.sections.map((sec, si) => {
    const qs = sec.questions.map((qu, qi) => renderQuestion(qu, si, qi)).join("");
    const inner = sec.layout === "grid" ? `<div class="grid">${qs}</div>` : qs;
    return `<div class="section">
      <div class="sec-head"><h3>Q${si + 1}) ${sec.title}</h3><span class="marks">(${sec.marks} marks)</span></div>
      ${sec.intro ? `<div class="sec-intro">${sec.intro}</div>` : ""}
      ${inner}</div>`;
  }).join("");
  if (current.note) $("sections").insertAdjacentHTML("afterbegin", `<div class="instr">${current.note}</div>`);
  window.scrollTo(0, 0);
}

// silent timing — first keystroke starts the clock, per-section first/last logged
document.addEventListener("input", e => {
  const isAns = e.target.classList && (e.target.classList.contains("ans") || e.target.type === "radio");
  if (!isAns || !timing || e.target.dataset.si === undefined) return;
  const now = Date.now();
  if (!timing.startedAt) timing.startedAt = now;
  const si = e.target.dataset.si;
  const t = timing.sections[si] = timing.sections[si] || { first: now };
  t.last = now;
});

function inputsOf(si, qi) { return [...document.querySelectorAll(`input.ans[data-si="${si}"][data-qi="${qi}"]`)]; }
function secTime(si) {
  const t = timing.sections[si];
  return t && t.last ? ((t.last - t.first) / 1000).toFixed(1) : "";
}
function totalTime() {
  return timing.startedAt && timing.submittedAt ? ((timing.submittedAt - timing.startedAt) / 1000).toFixed(1) : "";
}

// ============ Scoring ============
function collect() {
  const rows = [];
  current.sections.forEach((sec, si) => {
    const blanks = sec.questions.reduce((n, qu) => n + (qu.options ? 1 : qu.answers.length), 0);
    const perBlank = sec.marks / blanks;
    sec.questions.forEach((qu, qi) => {
      if (qu.options) {
        const sel = document.querySelector(`input[name="mc-${si}-${qi}"]:checked`);
        const ok = !!sel && Number(sel.value) === qu.answerIndex;
        const div = $(`q-${si}-${qi}`);
        div.classList.toggle("wrongmark", !ok); div.classList.toggle("rightmark", ok);
        rows.push({
          section: sec.title, qid: `${si + 1}.${qi + 1}`,
          question: qu.label + " | " + qu.options.map((o, oi) => `${LETTERS[oi]}) ${o}`).join("  "),
          given: sel ? LETTERS[Number(sel.value)] : "",
          correct: `${LETTERS[qu.answerIndex]}) ${qu.options[qu.answerIndex]}`,
          ok, marks: ok ? perBlank : 0, sectionTime: secTime(si)
        });
        return;
      }
      const inputs = inputsOf(si, qi);
      qu.answers.forEach((correct, slot) => {
        const el = inputs[slot];
        const given = el ? el.value.trim() : "";
        const ok = given !== "" && Number(given) === correct;
        if (el) { el.classList.toggle("wrongmark", !ok); el.classList.toggle("rightmark", ok); }
        rows.push({
          section: sec.title, qid: `${si + 1}.${qi + 1}` + (qu.answers.length > 1 ? "-" + (slot + 1) : ""),
          question: qu.label.replace(/\[_\]/g, "__").replace(/&nbsp;/g, " "),
          given, correct, ok, marks: ok ? perBlank : 0, sectionTime: secTime(si)
        });
      });
    });
  });
  return rows;
}

function submitSheet() {
  // one submission per attempt — stops duplicate rows in results.csv
  if (submitted) return;
  submitted = true;
  const btn = $("submitBtn");
  if (btn) { btn.textContent = "Checked ✓"; btn.disabled = true; btn.style.opacity = .5; }
  timing.submittedAt = timing.submittedAt || Date.now();
  lastRows = collect();
  const total = Math.round(lastRows.reduce((n, r) => n + r.marks, 0) * 10) / 10;
  $("scoreLine").textContent = `${total} / ${current.marks}`;
  const bySec = {};
  lastRows.forEach(r => {
    bySec[r.section] = bySec[r.section] || { right: 0, n: 0 };
    bySec[r.section].n++; if (r.ok) bySec[r.section].right++;
  });
  $("sectionTable").innerHTML = "<tr><th>Section</th><th>Correct</th></tr>" +
    Object.entries(bySec).map(([name, v]) => `<tr><td>${name}</td><td>${v.right} / ${v.n}</td></tr>`).join("");
  $("resultBox").style.display = "block";
  $("resultBox").scrollIntoView({ behavior: "smooth" });
  store.save({ id: current.id, date: $("date").value, student: $("student").value,
    score: total, max: current.marks, totalTime: totalTime() });
  // push to GitHub if configured; fall back to CSV download
  $("syncMsg").textContent = "";
  if (gh.cfg) {
    $("syncMsg").textContent = "Saving results…";
    ghSync(lastRows).then(ok => {
      $("syncMsg").textContent = ok ? "Results saved to GitHub ✓" : "Could not save to GitHub — downloading CSV instead.";
      if (!ok) downloadCsv();
    });
  } else {
    downloadCsv();
  }
}

// ============ GitHub results sync (single results/results.csv in the repo) ============
// Token lives ONLY in this browser's localStorage — never in the page source.
const gh = {
  get cfg() { try { return JSON.parse(localStorage.getItem("ambar-gh") || "null"); } catch { return null; } },
  set cfg(v) { v ? localStorage.setItem("ambar-gh", JSON.stringify(v)) : localStorage.removeItem("ambar-gh"); }
};
const CSV_HEADER = "worksheet,student,date,section,question_id,question,given_answer,correct_answer,is_correct,marks,section_time_s,total_time_s,submitted_at";
function csvRows(rows) {
  const student = $("student").value || "student";
  const date = $("date").value || new Date().toISOString().slice(0, 10);
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  const ts = new Date().toISOString();
  return rows.map(r => [
    current.title, student, date, r.section, r.qid, r.question,
    r.given, r.correct, r.ok ? "yes" : "no", Math.round(r.marks * 100) / 100, r.sectionTime, totalTime(), ts
  ].map(esc).join(",")).join("\n");
}
const b64encode = s => { const b = new TextEncoder().encode(s); let out = ""; b.forEach(c => out += String.fromCharCode(c)); return btoa(out); };
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
async function ghSync(rows) {
  const cfg = gh.cfg; if (!cfg || !cfg.repo || !cfg.token) return false;
  const api = `https://api.github.com/repos/${cfg.repo}/contents/results/results.csv`;
  const H = { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json" };
  try {
    let sha = null, existing = "";
    const res = await fetch(api, { headers: H });
    if (res.ok) { const j = await res.json(); sha = j.sha; existing = b64decode(j.content); }
    else if (res.status !== 404) return false;
    const content = (existing ? existing.replace(/\n+$/, "") : CSV_HEADER) + "\n" + csvRows(rows) + "\n";
    const put = await fetch(api, {
      method: "PUT", headers: H,
      body: JSON.stringify({ message: `results: ${current.title} (${$("date").value})`, content: b64encode(content), ...(sha ? { sha } : {}) })
    });
    return put.ok;
  } catch (e) { return false; }
}
function saveGh() {
  const repo = $("ghRepo").value.trim(), token = $("ghToken").value.trim();
  if (!repo || !token) { gh.cfg = null; $("ghMsg").textContent = "Sync off (repo or token empty)."; return; }
  gh.cfg = { repo, token };
  $("ghMsg").textContent = "Testing…";
  fetch(`https://api.github.com/repos/${repo}`, { headers: { Authorization: "Bearer " + token } })
    .then(r => {
      $("ghMsg").textContent = r.ok ? "Connected ✓ — results will save to GitHub automatically." : `Failed (${r.status}) — check repo name and token.`;
      if (r.ok) loadRemoteHistory();
    })
    .catch(() => $("ghMsg").textContent = "Failed — network error.");
}

function downloadCsv() {
  if (!lastRows) return;
  const student = $("student").value || "student";
  const date = $("date").value || new Date().toISOString().slice(0, 10);
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = ["worksheet,student,date,section,question_id,question,given_answer,correct_answer,is_correct,marks,section_time_s,total_time_s"]
    .concat(lastRows.map(r => [
      current.title, student, date, r.section, r.qid, r.question,
      r.given, r.correct, r.ok ? "yes" : "no", Math.round(r.marks * 100) / 100, r.sectionTime, totalTime()
    ].map(esc).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `Results - ${current.title} - ${student} - ${date}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ============ Print / PDF ============
function printBlank() {
  const checked = [...document.querySelectorAll('#sections input[type=radio]:checked')];
  checked.forEach(r => r.checked = false);
  document.body.classList.add("print-blank");
  window.print();
  document.body.classList.remove("print-blank");
  checked.forEach(r => r.checked = true);
}

// ============ Admin ============
function unlockAdmin() {
  if ($("pin").value !== ADMIN_PIN) { $("pinMsg").textContent = "Wrong PIN"; return; }
  $("pinMsg").textContent = "";
  const panel = $("keypanel");
  panel.style.display = "block";
  const timeRows = current.sections.map((sec, si) =>
    `<tr><td>${sec.title}</td><td>${secTime(si) ? secTime(si) + "s" : "not attempted"}</td></tr>`).join("");
  const started = timing.startedAt ? new Date(timing.startedAt).toLocaleTimeString() : "—";
  const totalLine = totalTime() ? `${totalTime()}s (submitted)`
    : timing.startedAt ? ((Date.now() - timing.startedAt) / 1000).toFixed(1) + "s (in progress)" : "not started";
  const histRows = store.allFor(current.id).map(r =>
    `<tr><td>${r.date}</td><td>${r.score} / ${r.max}</td><td>${r.totalTime ? r.totalTime + "s" : "—"}</td></tr>`).join("");
  panel.innerHTML =
    `<h4>Timing (this attempt)</h4>
     <table><tr><th>Started at</th><td>${started}</td></tr><tr><th>Total time</th><td>${totalLine}</td></tr></table>
     <table><tr><th>Section</th><th>Time spent</th></tr>${timeRows}</table>
     ${histRows ? `<h4>Past attempts (all synced devices)</h4><table><tr><th>Date</th><th>Score</th><th>Total time</th></tr>${histRows}</table>` : ""}
     <h4>Answer Key</h4>
     <table><tr><th>Q</th><th>Question</th><th>Answer</th></tr>` +
    current.sections.flatMap((sec, si) => sec.questions.map((qu, qi) =>
      qu.options
        ? `<tr><td>${si + 1}.${qi + 1}</td><td>${qu.label}</td><td><b>${LETTERS[qu.answerIndex]}) ${qu.options[qu.answerIndex]}</b></td></tr>`
        : `<tr><td>${si + 1}.${qi + 1}</td><td>${qu.label.replace(/\[_\]/g, "__").replace(/&nbsp;/g, " ")}</td><td><b>${qu.answers.join(", ")}</b></td></tr>`
    )).join("") + "</table>";
}

// ============ Init: #worksheet-id in the URL opens that sheet directly ============
const hashId = decodeURIComponent(location.hash.replace("#", ""));
if (hashId && WORKSHEETS.some(w => w.id === hashId)) openWs(hashId);
else if (hashId && NOTES.some(n => n.id === hashId)) openNote(hashId);
else renderHome();
loadRemoteHistory(); // pull done-sheet history from GitHub (no-op if sync is off)
</script>
